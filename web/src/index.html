<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <title>Moerise</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <section id="auth" class="memos-auth" aria-labelledby="auth-title">
    <select class="language-select" data-language aria-label="语言" data-i18n-aria-label="语言"><option value="zh-CN">简体中文</option><option value="en">English</option></select>
    <div class="memos-login">
      <div class="memos-brand"><img src="/favicon.svg" width="52" height="52" alt=""><span>Moerise</span></div>
      <h1 id="auth-title" class="sr" data-i18n="登录">登录</h1>
      <p class="memos-welcome" data-i18n="欢迎回来">欢迎回来</p>
      <p id="auth-error" class="error" role="alert" hidden></p>
      <form id="login-form" method="post" aria-labelledby="auth-title" hidden>
        <div><label for="username" data-i18n="用户名">用户名</label><input id="username" name="username" placeholder="用户名" autocomplete="username" required autocapitalize="off" autocorrect="off" spellcheck="false" data-i18n-placeholder="用户名"></div>
        <div><label for="password" data-i18n="密码">密码</label><input id="password" name="password" type="password" placeholder="密码" autocomplete="current-password" required data-i18n-placeholder="密码"></div>
        <button id="login" type="submit" data-i18n="登录" disabled>登录</button>
      </form>
      <button id="retry-logout" class="ghost" type="button" data-i18n="重试退出登录" hidden>重试退出登录</button>
    </div>
  </section>
  <div id="app" class="app" hidden>
    <header id="mobile-header" class="mobile-header">
      <div class="mobile-toolbar">
        <button id="navigation-toggle" class="btn" type="button" aria-label="打开导航" aria-controls="navigation-dialog" aria-expanded="false" aria-haspopup="dialog" data-i18n-aria-label="打开导航"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 9h15M4.5 15h9.5"></path></svg></button>
        <b>Moerise</b>
        <button id="search-toggle" class="btn" type="button" aria-label="搜索笔记" aria-controls="search-panel" aria-expanded="false" data-i18n-aria-label="搜索笔记"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.2"></circle><path d="m15.6 15.6 4 4"></path></svg></button>
      </div>
    </header>
    <dialog id="navigation-dialog" class="navigation-dialog" aria-label="主导航" data-i18n-aria-label="主导航"></dialog>
    <aside id="sidebar" class="side">
      <div class="sidebar-heading">
        <b>Moerise</b>
        <button id="navigation-close" class="btn mobile-only" type="button" aria-label="关闭导航" data-i18n-aria-label="关闭导航"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M6 18 18 6"></path></svg></button>
      </div>
      <div class="sidebar-content">
      <div class="sidebar-body">
      <section id="sidebar-calendar" aria-label="日历" style="display:flex;flex-direction:column;gap:4px" data-i18n-aria-label="日历">
        <div class="lab"><b id="calendar-title"></b><span style="display:flex">
          <button id="month-prev" class="btn calendar-month" type="button" aria-label="上个月" data-i18n-aria-label="上个月"><svg class="i" style="width:16px;height:16px" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 6l-6 6 6 6"></path></svg></button>
          <button id="month-next" class="btn calendar-month" type="button" aria-label="下个月" data-i18n-aria-label="下个月"><svg class="i" style="width:16px;height:16px" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 6l6 6-6 6"></path></svg></button>
        </span></div>
        <div id="calendar" class="hm"><span data-i18n="一">一</span><span data-i18n="二">二</span><span data-i18n="三">三</span><span data-i18n="四">四</span><span data-i18n="五">五</span><span data-i18n="六">六</span><span data-i18n="日">日</span></div>
      </section>
      <nav aria-label="主导航" style="display:flex;flex-direction:column;gap:2px" data-i18n-aria-label="主导航">
        <a class="ent on" href="/" data-route aria-current="page" data-i18n="主页"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h14M5 12h14M5 17h8.5"></path></svg>主页</a>
        <a class="ent" href="/review" data-route data-i18n="回顾"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 6.5C7 5.5 10 5.8 12 7.2C14 5.8 17 5.5 19.5 6.5V18C17 17 14 17.3 12 18.7C10 17.3 7 17 4.5 18Z"></path><path d="M12 7.2V18.5"></path></svg>回顾</a>
        <a class="ent" href="/walk" data-route data-i18n="漫步"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="6.5" cy="17.5" r="2"></circle><circle cx="17.5" cy="6.5" r="2"></circle><path d="M8.5 17.5H13.5C15.8 17.5 15.8 12 12 12C8.2 12 8.2 6.5 10.5 6.5H15.5"></path></svg>漫步</a>
        <a class="ent" href="/map" hidden data-route data-i18n="观星"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 4.5Q11 10.5 17 10.5Q11 10.5 11 16.5Q11 10.5 5 10.5Q11 10.5 11 4.5Z"></path><circle cx="17.8" cy="17" r="1.4" fill="currentColor" stroke="none"></circle><circle cx="17.8" cy="5.5" r="1" fill="currentColor" stroke="none"></circle></svg>观星</a>
        <a class="ent" href="/archived" data-route data-i18n="归档"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4.5" width="16" height="4" rx="1.5"></rect><path d="M5.5 8.5v9a2 2 0 0 0 2 2h9a2 2 0 0 0 2-2v-9"></path><path d="M10 13h4"></path></svg>归档</a>
      </nav>
      <section id="search-panel" class="search-panel" aria-label="搜索笔记" data-i18n-aria-label="搜索笔记">
        <div class="search-row">
          <div class="sq">
            <label class="sr" for="q" data-i18n="搜索笔记">搜索笔记</label><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.2"></circle><path d="m15.6 15.6 4 4"></path></svg>
            <input id="q" type="search" placeholder="搜索笔记" data-i18n-placeholder="搜索笔记">
          </div>
          <button id="search-close" class="btn mobile-only" type="button" aria-label="收起搜索" data-i18n-aria-label="收起搜索"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M6 18 18 6"></path></svg></button>
        </div>
        <label class="search-mode" for="search-mode" data-i18n="搜索方式">搜索方式
          <select id="search-mode">
            <option value="keyword" data-i18n="关键词">关键词</option>
            <option value="semantic" data-i18n="语义">语义</option>
            <option value="hybrid" data-i18n="混合">混合</option>
          </select>
        </label>
      </section>
      <p id="sidebar-error" class="error sub" role="alert" hidden></p>
      <button id="sidebar-retry" class="dlink" type="button" hidden data-i18n="重试加载筛选">重试加载筛选</button>
      <section id="sidebar-tags" aria-label="标签" class="tg" data-i18n-aria-label="标签">
        <div class="lab"><span data-i18n="标签">标签</span></div>
        <div id="tags"></div>
      </section>
      </div>
      <div id="account" hidden>
        <div class="account-row">
          <a id="account-settings" class="ent" href="/settings" data-route aria-label="设置" data-i18n-aria-label="设置">
            <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.5"></circle><path d="M5 20c1-4 4-5.5 7-5.5s6 1.5 7 5.5"></path></svg>
            <span id="account-name"></span>
            <svg class="i account-gear" viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 8h5M13.5 8h6M4.5 16h9M17.5 16h2"></path><circle cx="11.5" cy="8" r="2"></circle><circle cx="15.5" cy="16" r="2"></circle></svg>
          </a>
          <button id="sync-trigger" class="btn s account-sync" type="button" aria-label="同步" data-i18n-aria-label="同步" title="同步" data-i18n-title="同步"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 4v5h-5M4 20v-5h5M5 10a7 7 0 0 1 12-4l3 3M19 14a7 7 0 0 1-12 4l-3-3"></path></svg></button>
        </div>
      </div>
      </div>
    </aside>
    <a class="skip-link" href="#main" data-i18n="跳到正文">跳到正文</a>
    <main id="main" class="main" tabindex="-1">
      <div class="feed">
        <section id="workspace" class="stage" hidden>
          <span id="sync-status" role="img" hidden></span>
          <button id="back" class="ghost back" type="button" hidden data-i18n="‹ 返回主页">‹ 返回主页</button>
          <h1 id="view-title" class="vt" hidden></h1>
          <p id="capability" class="sub" hidden></p>
          <form id="composer" class="card composer" aria-label="新建笔记" data-i18n-aria-label="新建笔记">
            <label class="sr" for="content" data-i18n="写点什么">写点什么</label>
            <textarea id="content" name="content" rows="3" placeholder="今天想到了什么……" data-i18n-placeholder="今天想到了什么……"></textarea>
            <div id="draft-attachments" class="attachment-list"></div>
            <div class="bar"><div style="display:flex;align-items:center;gap:4px"><button id="add-attachment" class="btn" type="button" aria-label="添加附件" data-i18n-aria-label="添加附件"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button><input id="attachment-input" class="sr" type="file" multiple tabindex="-1"></div><button id="save" class="save" type="submit" data-i18n="保存">保存<small>Ctrl ↵</small></button></div>
            <p id="save-error" class="error" role="alert" hidden></p>
          </form>
          <div id="filters" class="fbar" hidden></div>
          <p id="empty" class="sub" style="text-align:center" hidden data-i18n="没有匹配的笔记">没有匹配的笔记</p>
          <div id="notes"></div>
          <p id="list-error" class="error" role="alert" hidden></p>
          <button id="list-retry" class="ghost" type="button" hidden data-i18n="重试">重试</button>
          <button id="load-more" class="ghost" type="button" hidden data-i18n="加载更多">加载更多</button>
          <div id="page-end" aria-hidden="true"></div>
        </section>
      </div>
    </main>
  </div>
</body>
</html>
