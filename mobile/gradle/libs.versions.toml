[versions]
kotlin = "2.2.20"
compose = "1.9.1"
agp = "8.11.1"
ksp = "2.2.20-2.0.4"
room = "2.8.3"
sqlite = "2.6.1"
ktor = "3.3.1"
coroutines = "1.10.2"
serialization = "1.9.0"
activity = "1.11.0"
lifecycle = "2.9.4"
core = "1.17.0"
markdown = "0.37.0"
androidx-test = "1.7.0"
androidx-test-junit = "1.3.0"
compose-android = "1.9.3"
tracing = "1.2.0"
benchmark = "1.4.1"
profileinstaller = "1.4.1"
uiautomator = "2.3.0"
material3 = "1.4.0"

[libraries]
room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
sqlite-framework = { module = "androidx.sqlite:sqlite-framework", version.ref = "sqlite" }
mockwebserver = { module = "com.squareup.okhttp3:mockwebserver", version = "5.1.0" }
robolectric = { module = "org.robolectric:robolectric", version = "4.16" }
androidx-test-core = { module = "androidx.test:core", version = "1.7.0" }
markdown-parser = { module = "org.jetbrains:markdown", version = "0.7.3" }
coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-client-mock = { module = "io.ktor:ktor-client-mock", version.ref = "ktor" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity" }
androidx-core = { module = "androidx.core:core-ktx", version.ref = "core" }
androidx-viewmodel = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
markdown = { module = "com.mikepenz:multiplatform-markdown-renderer-m3", version.ref = "markdown" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-test" }
androidx-test-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-junit" }
androidx-compose-test = { module = "androidx.compose.ui:ui-test-junit4", version.ref = "compose-android" }
androidx-tracing = { module = "androidx.tracing:tracing", version.ref = "tracing" }
androidx-benchmark = { module = "androidx.benchmark:benchmark-macro-junit4", version.ref = "benchmark" }
androidx-profileinstaller = { module = "androidx.profileinstaller:profileinstaller", version.ref = "profileinstaller" }
androidx-uiautomator = { module = "androidx.test.uiautomator:uiautomator", version.ref = "uiautomator" }
androidx-compose-foundation = { module = "androidx.compose.foundation:foundation", version.ref = "compose-android" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3", version.ref = "material3" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-test = { id = "com.android.test", version.ref = "agp" }

kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }

compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
room = { id = "androidx.room", version.ref = "room" }
