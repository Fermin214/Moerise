appId: ${APP_ID}
name: Signed-in home smoke
onFlowComplete:
- takeScreenshot:
    path: ${SCREENSHOT_PREFIX}-home-smoke-final
    label: Capture the isolated test UI
---
- runFlow:
    file: subflows/home.yaml
    label: Enter the signed-in home without clearing data
- tapOn:
    id: note_editor
    enabled: true
    label: Activate the specified control
- extendedWaitUntil:
    visible:
      id: note_editor
      focused: true
    timeout: 15000
    label: Wait for the expected UI state
- takeScreenshot:
    path: ${SCREENSHOT_PREFIX}-home-focused
    label: Capture the isolated test UI
- runFlow:
    commands:
    - hideKeyboard
    label: Dismiss the keyboard
- extendedWaitUntil:
    visible:
      id: save_note
    timeout: 15000
    label: Wait for the expected UI state
- takeScreenshot:
    path: ${SCREENSHOT_PREFIX}-home-ready
    label: Capture the isolated test UI
