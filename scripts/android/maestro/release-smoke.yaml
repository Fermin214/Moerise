appId: ${APP_ID}
name: Sign in and save a note from a fresh installation
onFlowComplete:
- takeScreenshot:
    path: ${SCREENSHOT_PREFIX}-save-final
    label: Capture the signed application after the write
---
- extendedWaitUntil:
    visible:
      id: welcome_enter
    timeout: 15000
    label: Require the welcome dialog on the fresh installation
- assertVisible:
    id: privacy_share
    checked: false
    label: Check that statistics are off by default
- runFlow:
    file: subflows/ensure-login.yaml
    label: Sign in to the HTTPS fixture
- runFlow:
    file: subflows/release-note.yaml
    label: Save a note in the signed APK
- tapOn:
    id: open_search
    enabled: true
    label: Open search in the minified release
- extendedWaitUntil:
    visible:
      id: search_query
    timeout: 15000
    label: Require release search semantics
- tapOn:
    id: search_close
    enabled: true
    label: Close release search
