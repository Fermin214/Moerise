appId: ${APP_ID}
name: Sign in and save a note from a fresh installation
onFlowComplete:
- takeScreenshot:
    path: ${SCREENSHOT_PREFIX}-save-final
    label: Capture the signed application after the write
---
- extendedWaitUntil:
    visible:
      id: welcome_enter
    timeout: 15000
    label: Require the welcome dialog on the fresh installation
- assertVisible:
    id: privacy_share
    checked: false
    label: Check that statistics are off by default
- runFlow:
    file: subflows/ensure-login.yaml
    label: Sign in to the HTTPS fixture
- extendedWaitUntil:
    visible:
      id: note_editor_empty
    timeout: 15000
    label: Wait for the empty home editor
- tapOn:
    id: note_editor
    enabled: true
    label: Focus the new note editor
- inputText:
    text: ${NEW_NOTE_TEXT}${INPUT_SUFFIX}
    label: Enter the unique release note
- eraseText:
    charactersToErase: 1
    label: Remove the input suffix
- runFlow:
    file: subflows/hide-keyboard.yaml
    label: Dismiss the input method
- tapOn:
    id: save_note
    enabled: true
    label: Save the note
- extendedWaitUntil:
    visible:
      id: note_editor_empty
    timeout: 15000
    label: Wait for the editor to clear
- tapOn:
    id: open_search
    enabled: true
    label: Open search in the minified release
- extendedWaitUntil:
    visible:
      id: search_query
    timeout: 15000
    label: Require release search semantics
- tapOn:
    id: search_close
    enabled: true
    label: Close release search
