appId: ${APP_ID}
name: Four settings tabs QQ destination and draft persistence
onFlowComplete:
- takeScreenshot:
    path: ${SCREENSHOT_PREFIX}-settings-final
    label: Capture home after clearing the settings draft
---
- runFlow:
    file: subflows/home.yaml
    label: Start on signed-in home
- runFlow:
    file: subflows/prepare-draft.yaml
    label: Prepare the independent settings draft
- runFlow:
    file: subflows/go-settings.yaml
    label: Open settings
- extendedWaitUntil:
    visible:
      id: settings_tab_0
      enabled: true
    timeout: 15000
    label: Wait for the general tab
- tapOn:
    id: settings_tab_0
    enabled: true
    label: Open general settings
- runFlow:
    when:
      notVisible:
        id: settings_tab_1
    commands:
    - assertNotVisible:
        id: settings_tab_1
        label: Check whether the AI tab needs scrolling
    - scrollUntilVisible:
        element:
          id: settings_tab_1
        direction: RIGHT
        timeout: 15000
        centerElement: false
        label: Reveal the AI tab on narrow screens
    label: Scroll only if the AI tab is hidden
- tapOn:
    id: settings_tab_1
    enabled: true
    label: Open AI settings
- runFlow:
    when:
      notVisible:
        id: settings_tab_2
    commands:
    - assertNotVisible:
        id: settings_tab_2
        label: Check whether the delivery tab needs scrolling
    - scrollUntilVisible:
        element:
          id: settings_tab_2
        direction: RIGHT
        timeout: 15000
        centerElement: false
        label: Reveal the delivery tab on narrow screens
    label: Scroll only if the delivery tab is hidden
- tapOn:
    id: settings_tab_2
    enabled: true
    label: Open review and delivery settings
- runFlow:
    when:
      notVisible:
        id: settings_channel_kind
    commands:
    - assertNotVisible:
        id: settings_channel_kind
        label: Check whether the channel selector needs scrolling
    - scrollUntilVisible:
        element:
          id: settings_channel_kind
        direction: DOWN
        timeout: 15000
        centerElement: false
        label: Reveal the scheduled destination
    label: Scroll only if the channel selector is hidden
- tapOn:
    id: settings_channel_kind
    enabled: true
    label: Choose a scheduled review destination
- tapOn:
    text: QQ 私聊|QQ private chat
    enabled: true
    label: Select QQ private chat
- extendedWaitUntil:
    visible:
      text: QQ 私聊|QQ private chat
      childOf:
        id: settings_channel_kind
    timeout: 15000
    label: Verify QQ was selected in the destination control
- runFlow:
    when:
      notVisible:
        id: settings_save
    commands:
    - assertNotVisible:
        id: settings_save
        label: Check whether save needs scrolling
    - scrollUntilVisible:
        element:
          text: 发送记录|Delivery history
        direction: DOWN
        timeout: 15000
        centerElement: false
        label: Bring save above the navigation bar using the following section
    label: Scroll only if save is hidden
- runFlow:
    when:
      notVisible:
        text: 发送记录|Delivery history
    commands:
    - assertNotVisible:
        text: 发送记录|Delivery history
        label: Check whether save is at the bottom edge
    - scrollUntilVisible:
        element:
          text: 发送记录|Delivery history
        direction: DOWN
        timeout: 15000
        centerElement: false
        label: Reveal the section below save before tapping it
    label: Keep save clear of the system navigation area
- tapOn:
    id: settings_save
    enabled: true
    label: Save the QQ destination
- runFlow:
    when:
      notVisible:
        text: 设置已保存。|Settings saved\.|设置服务繁忙，请稍后重新保存。|The settings service is busy\. Please save again later\.
    commands:
    - assertNotVisible:
        text: 设置已保存。|Settings saved\.|设置服务繁忙，请稍后重新保存。|The settings service is busy\. Please save again later\.
        label: Check whether confirmation is already visible
    - scrollUntilVisible:
        element:
          text: 设置已保存。|Settings saved\.|设置服务繁忙，请稍后重新保存。|The settings service is busy\. Please save again later\.
        direction: UP
        timeout: 15000
        centerElement: false
        label: Find confirmation after the form reflows
    label: Scroll only when save feedback is out of view
- runFlow:
    when:
      visible:
        text: 设置服务繁忙，请稍后重新保存。|The settings service is busy\. Please save again later\.
    commands:
    - assertVisible:
        text: 设置服务繁忙，请稍后重新保存。|The settings service is busy\. Please save again later\.
        label: Confirm Core returned a busy response
    - tapOn:
        id: settings_save
        enabled: true
        label: Retry the rejected save once
    label: Retry only a confirmed busy response
- extendedWaitUntil:
    visible:
      text: 设置已保存。|Settings saved\.
    timeout: 15000
    label: Wait for Core to confirm the update
- runFlow:
    when:
      notVisible:
        id: settings_channel_qq_app_id
    commands:
    - assertNotVisible:
        id: settings_channel_qq_app_id
        label: Check whether the AppID needs scrolling
    - scrollUntilVisible:
        element:
          id: settings_channel_qq_app_id
        direction: UP
        timeout: 15000
        centerElement: false
        label: Reveal the saved AppID
    label: Scroll only if the AppID is hidden
- assertVisible:
    id: settings_channel_qq_app_id
    text: "100000019"
    label: Confirm the original test AppID is still displayed
- runFlow:
    when:
      notVisible:
        id: settings_secret_qq_app_secret_action
    commands:
    - assertNotVisible:
        id: settings_secret_qq_app_secret_action
        label: Check whether the secret controls need scrolling
    - scrollUntilVisible:
        element:
          id: settings_secret_qq_app_secret_action
        direction: DOWN
        timeout: 15000
        centerElement: false
        label: Reveal the secret controls
    label: Scroll only if the secret controls are hidden
- assertVisible:
    id: settings_secret_qq_app_secret_action
    label: Confirm the saved secret still has replacement controls
- takeScreenshot:
    path: ${SCREENSHOT_PREFIX}-qq-preserved
    label: Capture the AppID and secret controls
- runFlow:
    when:
      notVisible:
        id: settings_tab_2
    commands:
    - assertNotVisible:
        id: settings_tab_2
        label: Check whether the tabs are above the form
    - scrollUntilVisible:
        element:
          id: settings_tab_2
        direction: UP
        timeout: 15000
        centerElement: false
        label: Return to the settings tabs
    label: Scroll vertically only if the tab strip is hidden
- runFlow:
    when:
      notVisible:
        id: settings_tab_3
    commands:
    - assertNotVisible:
        id: settings_tab_3
        label: Check whether the privacy tab needs scrolling
    - scrollUntilVisible:
        element:
          id: settings_tab_3
        direction: RIGHT
        timeout: 15000
        centerElement: false
        label: Reveal the privacy tab on narrow screens
    label: Scroll horizontally only if the privacy tab is hidden
- tapOn:
    id: settings_tab_3
    enabled: true
    label: Open privacy settings
- assertVisible:
    id: settings_page
    label: Confirm settings remains open
- runFlow:
    file: subflows/home.yaml
    label: Return home from privacy
- extendedWaitUntil:
    visible:
      id: note_editor
      text: \Q${DRAFT_TEXT}\E
    timeout: 15000
    label: Verify the exact draft survived settings navigation
- runFlow:
    file: subflows/clear-draft.yaml
    label: Clear the exact settings draft
