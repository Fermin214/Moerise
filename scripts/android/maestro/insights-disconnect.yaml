appId: ${APP_ID}
name: Partial reply survives a protocol disconnect and the next reply completes
onFlowComplete:
- takeScreenshot:
    path: ${SCREENSHOT_PREFIX}-final
    label: Capture the same conversation after recovery
---
- runFlow:
    file: subflows/new-insight.yaml
    label: Start a new independent conversation
- runFlow:
    file: subflows/add-material.yaml
    label: Select the exact dedicated material
- runFlow:
    file: subflows/clear-question.yaml
    label: Clear the test question before injecting the disconnect
- tapOn:
    id: chat_question
    enabled: true
    label: Focus the empty question field
- inputText:
    text: ${DISCONNECT_MARKER}${INPUT_SUFFIX}
    label: Enter the disconnect marker through the test keyboard
- eraseText:
    charactersToErase: 1
    label: Remove the temporary suffix
- assertVisible:
    id: chat_question
    text: \Q${DISCONNECT_MARKER}\E
    label: Require the exact disconnect marker before sending
- tapOn:
    id: chat_send
    enabled: true
    label: Request the response that disconnects
- extendedWaitUntil:
    visible:
      id: chat_reply_failed
    timeout: 65000
    label: Wait for the failed reply in the conversation
- takeScreenshot:
    path: ${SCREENSHOT_PREFIX}-partial
    label: Capture the failed reply and partial text
- runFlow:
    file: subflows/clear-question.yaml
    label: Remove any remaining disconnect marker from the question field
- tapOn:
    id: chat_question
    enabled: true
    label: Focus the cleared question field
- inputText:
    text: ${FOLLOWUP_TEXT}${INPUT_SUFFIX}
    label: Enter a unique ordinary follow-up
- eraseText:
    charactersToErase: 1
    label: Remove the temporary suffix
- assertVisible:
    id: chat_question
    text: \Q${FOLLOWUP_TEXT}\E
    label: Require the exact follow-up before sending
- tapOn:
    id: chat_send
    enabled: true
    label: Send the follow-up in the same conversation
- extendedWaitUntil:
    visible:
      id: chat_reply_completed
    timeout: 65000
    label: Wait for the successful follow-up reply
