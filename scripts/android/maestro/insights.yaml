appId: ${APP_ID}
name: Independent insight selection history and source reading
onFlowComplete:
- takeScreenshot:
    path: ${SCREENSHOT_PREFIX}-insights-final
    label: Capture the isolated test UI
---
- runFlow:
    file: subflows/home.yaml
    label: Enter the signed-in home without clearing data
- runFlow:
    file: subflows/prepare-draft.yaml
    label: Prepare an identifiable unfinished fixture draft
- runFlow:
    file: subflows/new-insight.yaml
    label: Create an independent insight without reusing previous materials
- runFlow:
    file: subflows/add-material.yaml
    label: Add the exact dedicated source note
- tapOn:
    id: chat_add_materials
    enabled: true
    label: Activate the specified control
- tapOn:
    id: chat_picker_selected
    enabled: true
    label: Activate the specified control
- extendedWaitUntil:
    visible:
      id: chat_picker_read_${NOTE_NAME}
      enabled: true
    timeout: 15000
    label: Wait for the expected UI state
- takeScreenshot:
    path: ${SCREENSHOT_PREFIX}-insights-source
    label: Capture the isolated test UI
- tapOn:
    enabled: true
    id: chat_picker_read_${NOTE_NAME}
    label: Activate the specified control
- extendedWaitUntil:
    visible:
      id: note_card_${NOTE_NAME}
    timeout: 15000
    label: Wait for the expected UI state
- assertVisible:
    text: \Q${NOTE_TEXT}\E
    childOf:
      id: note_card_${NOTE_NAME}
    label: Check the expected UI state
- runFlow:
    file: subflows/open-menu.yaml
    label: Open navigation after reading the selected source
- tapOn:
    id: nav_home
    enabled: true
    label: Clear the source-reading target before locating the composer
- scrollUntilVisible:
    element:
      id: note_editor
    direction: UP
    timeout: 15000
    centerElement: false
    label: Locate the specified control without coordinates
- extendedWaitUntil:
    visible:
      id: note_editor
      text: \Q${DRAFT_TEXT}\E
    timeout: 15000
    label: Wait for the expected UI state
- runFlow:
    file: subflows/go-insights.yaml
    label: Return to the independent insight
- extendedWaitUntil:
    visible:
      id: chat_material_summary
    timeout: 15000
    label: Wait for the expected UI state
- tapOn:
    id: chat_session_menu
    enabled: true
    label: Activate the specified control
- extendedWaitUntil:
    visible:
      id: chat_history
    timeout: 15000
    label: Wait for the expected UI state
- tapOn:
    id: chat_history
    enabled: true
    label: Activate the specified control
- extendedWaitUntil:
    visible:
      id: chat_history_dialog
    timeout: 15000
    label: Wait for the expected UI state
- tapOn:
    id: chat_history_dialog_close
    enabled: true
    label: Activate the specified control
- extendedWaitUntil:
    notVisible:
      id: chat_history_dialog
    timeout: 15000
    label: Wait for the expected UI state
- assertNotVisible:
    id: chat_error
    label: Check the expected UI state
- tapOn:
    id: chat_insight
    enabled: true
    label: Generate the first reply with the fixture model
- extendedWaitUntil:
    visible:
      id: chat_reply_completed
    timeout: 65000
    label: Wait for the completed reply in the conversation
- assertNotVisible:
    id: chat_add_materials
    label: Check that selection has given way to the conversation
- tapOn:
    id: chat_session_menu
    enabled: true
    label: Open the conversation actions
- tapOn:
    id: chat_save_selection
    enabled: true
    label: Open the message selection
- extendedWaitUntil:
    visible:
      id: chat_save_confirm
      enabled: true
    timeout: 15000
    label: Require the completed reply to be selected by default
- tapOn:
    id: chat_save_confirm
    enabled: true
    label: Save the selected reply as a note
- extendedWaitUntil:
    notVisible:
      id: chat_save_dialog
    timeout: 65000
    label: Require acknowledgement of the saved note
- runFlow:
    file: subflows/home.yaml
    label: Enter the signed-in home without clearing data
- runFlow:
    file: subflows/clear-draft.yaml
    label: Clear only the known fixture draft
