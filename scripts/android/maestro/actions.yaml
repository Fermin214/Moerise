appId: ${APP_ID}
name: Preserve the fixture draft through archive restore and both dedicated deletions
onFlowComplete:
- takeScreenshot:
    path: ${SCREENSHOT_PREFIX}-actions-final
    label: Capture the isolated test UI
---
- runFlow:
    file: subflows/home.yaml
    label: Start the action scenario from the signed-in home
- runFlow:
    file: subflows/prepare-draft.yaml
    label: Prepare only the exact unfinished fixture draft
- runFlow:
    file: archive.yaml
    label: Archive and restore the dedicated test note
- scrollUntilVisible:
    element:
      id: note_editor
    direction: UP
    timeout: 15000
    centerElement: false
    label: Return to the top composer without changing its contents
- extendedWaitUntil:
    visible:
      id: note_editor
      text: \Q${DRAFT_TEXT}\E
    timeout: 15000
    label: Verify the exact unfinished draft survives the note action
- scrollUntilVisible:
    element:
      id: note_card_${PEER_NOTE_NAME}
    direction: DOWN
    timeout: 15000
    centerElement: false
    label: Locate the specified control without coordinates
- assertVisible:
    text: \Q${PEER_NOTE_TEXT}\E
    childOf:
      id: note_card_${PEER_NOTE_NAME}
    label: Check the expected UI state
- scrollUntilVisible:
    element:
      id: note_card_${NOTE_NAME}
    direction: DOWN
    timeout: 15000
    centerElement: false
    label: Locate the specified control without coordinates
- tapOn:
    id: note_more_${NOTE_NAME}
    enabled: true
    label: Activate the specified control
- extendedWaitUntil:
    visible:
      id: delete_note_${NOTE_NAME}
      enabled: true
    timeout: 15000
    label: Wait for the expected UI state
- tapOn:
    id: delete_note_${NOTE_NAME}
    enabled: true
    label: Activate the specified control
- extendedWaitUntil:
    visible:
      id: delete_confirm_${NOTE_NAME}
      enabled: true
    timeout: 15000
    label: Wait for the expected UI state
- tapOn:
    id: delete_confirm_${NOTE_NAME}
    enabled: true
    label: Activate the specified control
- extendedWaitUntil:
    notVisible:
      id: note_card_${NOTE_NAME}
    timeout: 15000
    label: Wait for the expected UI state
- scrollUntilVisible:
    element:
      id: note_editor
    direction: UP
    timeout: 15000
    centerElement: false
    label: Return to the top composer without changing its contents
- extendedWaitUntil:
    visible:
      id: note_editor
      text: \Q${DRAFT_TEXT}\E
    timeout: 15000
    label: Verify the exact unfinished draft survives the note action
- scrollUntilVisible:
    element:
      id: note_card_${PEER_NOTE_NAME}
    direction: DOWN
    timeout: 15000
    centerElement: false
    label: Locate the specified control without coordinates
- assertVisible:
    text: \Q${PEER_NOTE_TEXT}\E
    childOf:
      id: note_card_${PEER_NOTE_NAME}
    label: Check the expected UI state
- takeScreenshot:
    path: ${SCREENSHOT_PREFIX}-actions-peer-survives
    label: Capture the isolated test UI
- tapOn:
    id: note_more_${PEER_NOTE_NAME}
    enabled: true
    label: Open only the peer note after verifying it is unchanged
- extendedWaitUntil:
    visible:
      id: delete_note_${PEER_NOTE_NAME}
      enabled: true
    timeout: 15000
    label: Wait for the dedicated peer delete action
- tapOn:
    id: delete_note_${PEER_NOTE_NAME}
    enabled: true
    label: Request deletion of the dedicated peer note
- extendedWaitUntil:
    visible:
      id: delete_confirm_${PEER_NOTE_NAME}
      enabled: true
    timeout: 15000
    label: Wait for peer deletion confirmation
- tapOn:
    id: delete_confirm_${PEER_NOTE_NAME}
    enabled: true
    label: Confirm deletion of only the dedicated peer note
- extendedWaitUntil:
    notVisible:
      id: note_card_${PEER_NOTE_NAME}
    timeout: 15000
    label: Require the deleted peer card to disappear
- scrollUntilVisible:
    element:
      id: note_editor
    direction: UP
    timeout: 15000
    centerElement: false
    label: Return to the top composer without changing its contents
- extendedWaitUntil:
    visible:
      id: note_editor
      text: \Q${DRAFT_TEXT}\E
    timeout: 15000
    label: Verify the exact unfinished draft survives the note action
- assertNotVisible:
    id: note_card_${NOTE_NAME}
    label: Keep the first dedicated note deleted
- assertNotVisible:
    id: note_card_${PEER_NOTE_NAME}
    label: Keep the dedicated peer note deleted
- takeScreenshot:
    path: ${SCREENSHOT_PREFIX}-actions-draft-survived
    label: Capture the draft after both dedicated deletions
- runFlow:
    file: subflows/clear-draft.yaml
    label: Clear only the exact fixture draft after both deletions
