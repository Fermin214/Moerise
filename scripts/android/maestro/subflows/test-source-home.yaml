appId: ${APP_ID}
name: Verify the expected sidebar account and reset the home timeline
onFlowComplete:
- takeScreenshot:
    path: ${SCREENSHOT_PREFIX}-source-home
    label: Capture the home timeline
---
- runFlow:
    file: open-menu.yaml
    label: Open the navigation drawer without syncing
- runFlow:
    when:
      notVisible:
        id: account_menu
        text: \Q${EXPECTED_ACCOUNT}\E
    commands:
    - assertNotVisible:
        id: account_menu
        text: \Q${EXPECTED_ACCOUNT}\E
        label: Check whether the account row exposes a separate text node
    - assertVisible:
        text: \Q${EXPECTED_ACCOUNT}\E
        childOf:
          id: account_menu
        label: Require the verified server account
    label: Match the test account even if the text is a child node
- tapOn:
    id: nav_home
    enabled: true
    label: Reset archive and search filters in the verified account
