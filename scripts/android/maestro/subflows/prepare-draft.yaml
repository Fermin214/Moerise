appId: ${APP_ID}
name: Prepare only the known fixture draft
onFlowComplete:
- takeScreenshot:
    path: ${SCREENSHOT_PREFIX}-prepare-draft-final
    label: Capture the isolated test UI
---
- runFlow:
    when:
      visible:
        id: note_editor_empty
    commands:
    - assertVisible:
        id: note_editor_empty
        label: Check the conditional branch precondition
    - tapOn:
        id: note_editor
        enabled: true
        label: Activate the specified control
    - inputText:
        text: ${DRAFT_TEXT}
        label: Enter the supplied ASCII fixture value
    - runFlow:
        commands:
        - hideKeyboard
        label: Dismiss the keyboard
    - extendedWaitUntil:
        visible:
          id: note_editor
          text: \Q${DRAFT_TEXT}\E
        timeout: 15000
        label: Wait for the expected UI state
    label: Populate an empty composer without overwriting another draft
- extendedWaitUntil:
    visible:
      id: note_editor
      text: \Q${DRAFT_TEXT}\E
    timeout: 15000
    label: Wait for the expected UI state
