appId: ${APP_ID}
name: Navigate directly to insights
onFlowComplete:
- takeScreenshot:
    path: ${SCREENSHOT_PREFIX}-go-insights-final
    label: Capture the isolated test UI
---
- runFlow:
    file: open-menu.yaml
    label: Open navigation
- scrollUntilVisible:
    element:
      id: nav_insights
    direction: DOWN
    timeout: 15000
    centerElement: false
    label: Locate the specified control without coordinates
- tapOn:
    id: nav_insights
    enabled: true
    label: Activate the specified control
- extendedWaitUntil:
    visible:
      id: insights_page
    timeout: 15000
    label: Wait for the expected UI state
