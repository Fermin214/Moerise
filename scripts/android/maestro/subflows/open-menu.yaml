appId: ${APP_ID}
name: Open the app navigation drawer
onFlowComplete:
- takeScreenshot:
    path: ${SCREENSHOT_PREFIX}-open-menu-final
    label: Capture the isolated test UI
---
- extendedWaitUntil:
    visible:
      id: open_menu
    timeout: 15000
    label: Wait for the expected UI state
- tapOn:
    id: open_menu
    enabled: true
    label: Activate the specified control
- extendedWaitUntil:
    visible:
      id: sidebar_account
    timeout: 15000
    label: Wait for the expected UI state
