appId: ${APP_ID}
name: Dismiss only an observed visible input method
onFlowComplete:
- takeScreenshot:
    path: ${SCREENSHOT_PREFIX}-hide-keyboard-final
    label: Capture the isolated test UI
---
- runFlow:
    when:
      visible:
        id: ime_visible
    commands:
    - assertVisible:
        id: ime_visible
        label: Require the app window to report a visible input method
    - hideKeyboard:
        label: Dismiss the observed input method
    label: Dismiss the input method only while it is visible
