appId: ${APP_ID}
name: Home walk home with enabled or disabled checks
onFlowComplete:
- takeScreenshot:
    path: ${SCREENSHOT_PREFIX}-walk-roundtrip-final
    label: Capture the isolated test UI
---
- runFlow:
    file: home.yaml
    label: Start walk from home
- runFlow:
    file: open-menu.yaml
    label: Open navigation
- scrollUntilVisible:
    element:
      id: nav_walk
    direction: DOWN
    timeout: 15000
    centerElement: false
    label: Locate the specified control without coordinates
- tapOn:
    id: nav_walk
    enabled: true
    label: Activate the specified control
- extendedWaitUntil:
    visible:
      id: walk_page
    timeout: 15000
    label: Wait for the expected UI state
- extendedWaitUntil:
    visible:
      id: walk_settings|walk_start|walk_end
      enabled: true
    timeout: 15000
    label: Wait for the expected UI state
- runFlow:
    when:
      visible:
        id: walk_end
    commands:
    - assertVisible:
        id: walk_end
        label: Check the conditional branch precondition
    - tapOn:
        id: walk_end
        enabled: true
        label: Activate the specified control
    - extendedWaitUntil:
        visible:
          id: walk_start
        timeout: 15000
        label: Wait for the expected UI state
    label: Finish an existing walk before starting this scenario
- assertNotVisible:
    id: walk_configuration_error
    label: Check the expected UI state
- assertNotVisible:
    id: discovery_error
    label: Check the expected UI state
- extendedWaitUntil:
    visible:
      id: walk_start
    timeout: 15000
    label: Wait for the expected UI state
- runFlow:
    when:
      visible:
        id: walk_settings
    commands:
    - assertVisible:
        id: walk_settings
        label: Check the conditional branch precondition
    - assertVisible:
        id: walk_start
        enabled: false
        label: Check the expected UI state
    - takeScreenshot:
        path: ${SCREENSHOT_PREFIX}-walk-disabled
        label: Capture the isolated test UI
    label: Check that disabled embeddings prohibit walking
- runFlow:
    when:
      visible:
        id: walk_start
        enabled: true
    commands:
    - assertVisible:
        id: walk_start
        enabled: true
        label: Check the conditional branch precondition
    - assertNotVisible:
        id: walk_settings
        label: Check the expected UI state
    - tapOn:
        id: walk_start
        enabled: true
        label: Activate the specified control
    - extendedWaitUntil:
        visible:
          id: walk_end
        timeout: 15000
        label: Wait for the expected UI state
    - assertNotVisible:
        id: discovery_error
        label: Check the expected UI state
    - takeScreenshot:
        path: ${SCREENSHOT_PREFIX}-walk-started
        label: Capture the isolated test UI
    - tapOn:
        id: walk_end
        enabled: true
        label: Activate the specified control
    - extendedWaitUntil:
        visible:
          id: walk_start
          enabled: true
        timeout: 15000
        label: Wait for the expected UI state
    label: Start and stop a walk when embeddings are enabled
- runFlow:
    when:
      visible:
        id: walk_start
        enabled: false
    commands:
    - assertVisible:
        id: walk_start
        enabled: false
        label: Check the conditional branch precondition
    - assertVisible:
        id: walk_settings
        label: Check the expected UI state
    - assertNotVisible:
        id: walk_configuration_error
        label: Check the expected UI state
    label: Reject unexplained disabled walk controls
- runFlow:
    file: home.yaml
    label: Return from walk
