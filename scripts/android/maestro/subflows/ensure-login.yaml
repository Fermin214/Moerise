appId: ${APP_ID}
name: Keep or establish the fixture session
onFlowComplete:
- takeScreenshot:
    path: ${SCREENSHOT_PREFIX}-ensure-login-final
    label: Capture the isolated test UI
---
- launchApp:
    clearState: false
    stopApp: false
    label: Foreground the installed app without clearing or stopping it
- extendedWaitUntil:
    visible:
      id: open_menu|server_login
    timeout: 15000
    label: Wait for either login or the authenticated toolbar
- runFlow:
    when:
      visible:
        id: server_login
    commands:
    - assertVisible:
        id: server_login
        label: Check the conditional branch precondition
    - runFlow:
        when:
          notVisible:
            id: server_origin
        commands:
        - assertNotVisible:
            id: server_origin
            label: Check the conditional branch precondition
        - extendedWaitUntil:
            visible:
              id: server_change
              enabled: true
            timeout: 15000
            label: Wait for the expected UI state
        - tapOn:
            id: server_change
            enabled: true
            label: Activate the specified control
        - extendedWaitUntil:
            visible:
              id: server_origin
              enabled: true
            timeout: 15000
            label: Wait for the expected UI state
        label: Expose the server field only when it is hidden
    - extendedWaitUntil:
        visible:
          id: server_origin
          enabled: true
        timeout: 15000
        label: Wait for the expected UI state
    - runFlow:
        when:
          notVisible:
            id: server_origin
            text: ^$
        commands:
        - assertNotVisible:
            id: server_origin
            text: ^$
            label: Require the known input to contain text
        - longPressOn:
            id: server_origin
            enabled: true
            label: Open text selection for the known input
        - extendedWaitUntil:
            visible:
              text: Select all|Select All|全选
            timeout: 15000
            label: Wait for the text selection action
        - tapOn:
            text: Select all|Select All|全选
            enabled: true
            label: Select the complete fixture input
        - eraseText:
            charactersToErase: 1
            label: Delete the selected fixture text
        label: Clear the known input regardless of caret position
    - tapOn:
        id: server_origin
        enabled: true
        label: Focus the empty fixture input
    - inputText:
        text: ${MAESTRO_FIXTURE_ORIGIN}
        label: Enter the supplied ASCII fixture value
    - runFlow:
        when:
          notVisible:
            id: server_username
            text: ^$
        commands:
        - assertNotVisible:
            id: server_username
            text: ^$
            label: Require the known input to contain text
        - longPressOn:
            id: server_username
            enabled: true
            label: Open text selection for the known input
        - extendedWaitUntil:
            visible:
              text: Select all|Select All|全选
            timeout: 15000
            label: Wait for the text selection action
        - tapOn:
            text: Select all|Select All|全选
            enabled: true
            label: Select the complete fixture input
        - eraseText:
            charactersToErase: 1
            label: Delete the selected fixture text
        label: Clear the known input regardless of caret position
    - tapOn:
        id: server_username
        enabled: true
        label: Focus the empty fixture input
    - inputText:
        text: ${MAESTRO_FIXTURE_USERNAME}
        label: Enter the supplied ASCII fixture value
    - runFlow:
        when:
          notVisible:
            id: server_password
            text: ^$
        commands:
        - assertNotVisible:
            id: server_password
            text: ^$
            label: Require the known input to contain text
        - longPressOn:
            id: server_password
            enabled: true
            label: Open text selection for the known input
        - extendedWaitUntil:
            visible:
              text: Select all|Select All|全选
            timeout: 15000
            label: Wait for the text selection action
        - tapOn:
            text: Select all|Select All|全选
            enabled: true
            label: Select the complete fixture input
        - eraseText:
            charactersToErase: 1
            label: Delete the selected fixture text
        label: Clear the known input regardless of caret position
    - tapOn:
        id: server_password
        enabled: true
        label: Focus the empty fixture input
    - inputText:
        text: ${MAESTRO_FIXTURE_PASSWORD}
        label: Enter the supplied ASCII fixture value
    - runFlow:
        commands:
        - hideKeyboard
        label: Dismiss the keyboard
    - extendedWaitUntil:
        visible:
          id: server_login
          enabled: true
        timeout: 15000
        label: Wait for the expected UI state
    - tapOn:
        id: server_login
        enabled: true
        label: Activate the specified control
    - extendedWaitUntil:
        visible:
          id: open_menu
        timeout: 15000
        label: Wait for the expected UI state
    label: Sign in only when the login form is present
- extendedWaitUntil:
    visible:
      id: open_menu
    timeout: 15000
    label: Wait for the expected UI state
- assertNotVisible:
    id: server_login
    label: Check the expected UI state
