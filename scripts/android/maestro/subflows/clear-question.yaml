appId: ${APP_ID}
name: Clear the dedicated test conversation question
onFlowComplete:
- takeScreenshot:
    path: ${SCREENSHOT_PREFIX}-question-cleared
    label: Capture the cleared question field
---
- runFlow:
    when:
      notVisible:
        text: 围绕所选笔记提问或追问…|Ask about the selected notes…
    commands:
    - assertNotVisible:
        text: 围绕所选笔记提问或追问…|Ask about the selected notes…
        label: Check for residual text in the fixture question
    - longPressOn:
        id: chat_question
        enabled: true
        label: Open text selection for the fixture question
    - runFlow:
        when:
          notVisible:
            text: Select all|Select All|全选
        commands:
        - assertNotVisible:
            text: Select all|Select All|全选
            label: Check whether full selection is in the overflow
        - tapOn:
            id: android:id/overflow
            enabled: true
            label: Reveal the full-selection action
        label: Open text toolbar overflow only when required
    - tapOn:
        text: Select all|Select All|全选
        enabled: true
        label: Select the entire fixture question
    - eraseText:
        charactersToErase: 1
        label: Delete the selected text
    label: Clear the residual question regardless of caret position
- assertVisible:
    text: 围绕所选笔记提问或追问…|Ask about the selected notes…
    label: Require an empty fixture question before new input
