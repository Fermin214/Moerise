appId: ${APP_ID}
name: Home insights home
onFlowComplete:
  - takeScreenshot:
      path: ${SCREENSHOT_PREFIX}-insights-roundtrip-final
      label: Capture insights roundtrip completion or failure
---
- runFlow:
    file: home.yaml
    label: Start the insights scenario from home
- tapOn:
    id: open_menu
    enabled: true
    label: Open navigation for insights
- extendedWaitUntil:
    visible:
      id: nav_insights
    timeout: 15000
    label: Wait for the insights navigation entry
- tapOn:
    id: nav_insights
    enabled: true
    label: Navigate directly to insights
- extendedWaitUntil:
    visible:
      id: insights_page
    timeout: 15000
    label: Wait for the insights page
- extendedWaitUntil:
    visible:
      id: chat_add_materials
      enabled: true
    timeout: 15000
    label: Wait for material selection to become available
- takeScreenshot:
    path: ${SCREENSHOT_PREFIX}-insights
    label: Capture the insights page
- runFlow:
    file: home.yaml
    label: Return from insights to the existing home draft
