appId: ${APP_ID}
name: Save a note in the signed APK
onFlowComplete:
- takeScreenshot:
    path: ${SCREENSHOT_PREFIX}-note-saved
    label: Capture the signed application after the write
---
- extendedWaitUntil:
    visible:
      id: note_editor_empty
    timeout: 15000
    label: Wait for the empty home editor
- tapOn:
    id: note_editor
    enabled: true
    label: Focus the new note editor
- inputText:
    text: ${NEW_NOTE_TEXT}${INPUT_SUFFIX}
    label: Enter the unique release note
- eraseText:
    charactersToErase: 1
    label: Remove the input suffix
- runFlow:
    when:
      notVisible:
        id: save_note
    commands:
    - assertNotVisible:
        id: save_note
        label: Check whether composer save is hidden
    - runFlow:
        file: hide-keyboard.yaml
        label: Dismiss the keyboard only for an obscured save control
    label: Skip keyboard dismissal when save is visible
- tapOn:
    id: save_note
    enabled: true
    label: Save the note
- extendedWaitUntil:
    visible:
      id: note_editor_empty
    timeout: 15000
    label: Wait for the editor to clear
