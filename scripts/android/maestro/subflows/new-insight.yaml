appId: ${APP_ID}
name: Create an independent insight through the UI
onFlowComplete:
- takeScreenshot:
    path: ${SCREENSHOT_PREFIX}-new-insight-final
    label: Capture the isolated test UI
---
- runFlow:
    file: go-insights.yaml
    label: Navigate directly to insights
- extendedWaitUntil:
    visible:
      id: chat_session_menu
      enabled: true
    timeout: 15000
    label: Wait for the expected UI state
- tapOn:
    id: chat_session_menu
    enabled: true
    label: Activate the specified control
- extendedWaitUntil:
    visible:
      id: chat_new
      enabled: true
    timeout: 15000
    label: Wait for the expected UI state
- tapOn:
    id: chat_new
    enabled: true
    label: Activate the specified control
- extendedWaitUntil:
    visible:
      id: chat_add_materials
      enabled: true
    timeout: 15000
    label: Wait for the expected UI state
- assertNotVisible:
    id: chat_material_summary
    label: Check the expected UI state
- assertNotVisible:
    id: chat_delete
    label: Check the expected UI state
- assertNotVisible:
    id: chat_error
    label: Check the expected UI state
