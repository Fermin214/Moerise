appId: ${APP_ID}
name: Match the verified account and its exact cached test marker offline
onFlowComplete:
- takeScreenshot:
    path: ${SCREENSHOT_PREFIX}-complete
    label: Capture the offline identity result
---
- runFlow:
    file: subflows/test-source-home.yaml
    label: Confirm account and return to unfiltered home
- tapOn:
    id: open_search
    enabled: true
    label: Open local keyword search
- extendedWaitUntil:
    visible:
      id: search_query_empty
    timeout: 15000
    label: Require the empty search field
- tapOn:
    id: search_query
    enabled: true
    label: Focus the local keyword search field
- inputText:
    text: ${QUERY_TEXT}${INPUT_SUFFIX}
    label: Enter the previously verified note marker
- eraseText:
    charactersToErase: 1
    label: Remove only the temporary input suffix
- pressKey:
    key: Enter
    label: Submit the search without leaving the app
- scrollUntilVisible:
    element:
      text: \Q${NOTE_TEXT}\E
      childOf:
        id: note_card_${NOTE_NAME}
    direction: DOWN
    timeout: 15000
    centerElement: false
    label: Locate the exact cached note and marker
- assertVisible:
    text: \Q${NOTE_TEXT}\E
    childOf:
      id: note_card_${NOTE_NAME}
    label: Require the cached proof before reconnecting
