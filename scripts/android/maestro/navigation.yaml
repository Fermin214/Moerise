appId: ${APP_ID}
name: Review walk map settings and home navigation
onFlowComplete:
- takeScreenshot:
    path: ${SCREENSHOT_PREFIX}-navigation-final
    label: Capture home after the navigation scenarios
---
- runFlow:
    file: navigation-review.yaml
    label: Check review results and return home
- runFlow:
    file: navigation-walk.yaml
    label: Check walk behavior and return home
- runFlow:
    file: navigation-map.yaml
    label: Check stargazing behavior and return home
- runFlow:
    file: navigation-settings.yaml
    label: Check settings and the independent settings draft
