appId: ${APP_ID}
name: Review walk map settings and home navigation
onFlowComplete:
- takeScreenshot:
    path: ${SCREENSHOT_PREFIX}-navigation-final
    label: Capture the isolated test UI
---
- runFlow:
    file: subflows/home.yaml
    label: Enter the signed-in home without clearing data
- runFlow:
    file: subflows/prepare-draft.yaml
    label: Prepare the exact unfinished navigation draft
- runFlow:
    file: subflows/review-roundtrip.yaml
    label: Check review results
- runFlow:
    file: subflows/walk-roundtrip.yaml
    label: Check enabled or disabled walk behavior
- runFlow:
    file: subflows/map-roundtrip.yaml
    label: Check enabled or disabled map behavior
- runFlow:
    file: subflows/go-settings.yaml
    label: Visit the settings sections
- extendedWaitUntil:
    visible:
      id: settings_tab_0
      enabled: true
    timeout: 15000
    label: Wait for the expected UI state
- tapOn:
    id: settings_tab_0
    enabled: true
    label: Activate the specified control
- assertVisible:
    id: settings_page
    label: Check the expected UI state
- extendedWaitUntil:
    visible:
      id: settings_tab_2
      enabled: true
    timeout: 15000
    label: Wait for the expected UI state
- tapOn:
    id: settings_tab_2
    enabled: true
    label: Activate the specified control
- assertVisible:
    id: settings_page
    label: Check the expected UI state
- scrollUntilVisible:
    element:
      id: settings_channel_kind
    direction: DOWN
    timeout: 15000
    centerElement: true
    label: Find the scheduled review destination
- tapOn:
    id: settings_channel_kind
    enabled: true
    label: Choose the scheduled review destination
- tapOn:
    text: QQ 私聊|QQ private chat
    enabled: true
    label: Select QQ private chat
- scrollUntilVisible:
    element:
      id: settings_save
    direction: DOWN
    timeout: 15000
    centerElement: false
    label: Find the settings save button
- tapOn:
    id: settings_save
    enabled: true
    label: Save the QQ review destination
- scrollUntilVisible:
    element:
      text: 设置已保存。|Settings saved\.|设置服务繁忙，请稍后重新保存。|The settings service is busy\. Please save again later\.
    direction: DOWN
    timeout: 15000
    centerElement: false
    label: Find the result after the saved form reflows
- extendedWaitUntil:
    visible:
      text: 设置已保存。|Settings saved\.|设置服务繁忙，请稍后重新保存。|The settings service is busy\. Please save again later\.
    timeout: 15000
    label: Wait for the result of the first save
- runFlow:
    when:
      visible:
        text: 设置服务繁忙，请稍后重新保存。|The settings service is busy\. Please save again later\.
    commands:
    - assertVisible:
        text: 设置服务繁忙，请稍后重新保存。|The settings service is busy\. Please save again later\.
        label: Confirm Core rejected the update as busy
    - tapOn:
        id: settings_save
        enabled: true
        label: Retry the rejected save once
    label: Retry only when Core reports busy
- extendedWaitUntil:
    visible:
      text: 设置已保存。|Settings saved\.
    timeout: 15000
    label: Wait for Core to confirm the versioned change
- scrollUntilVisible:
    element:
      id: settings_channel_qq_app_id
    direction: UP
    timeout: 15000
    centerElement: true
    label: Find the QQ AppID field in review and delivery
- assertVisible:
    id: settings_channel_qq_app_id
    label: Read the QQ AppID saved by the fixture
- assertVisible:
    id: settings_secret_qq_app_secret_action
    label: Confirm the saved QQ secret has replacement controls
- scrollUntilVisible:
    element:
      id: settings_tab_2
    direction: UP
    timeout: 15000
    centerElement: true
    label: Return to the settings tabs
- scrollUntilVisible:
    element:
      id: settings_tab_3
    direction: RIGHT
    timeout: 15000
    centerElement: true
    label: Reveal the privacy settings tab
- extendedWaitUntil:
    visible:
      id: settings_tab_3
      enabled: true
    timeout: 15000
    label: Wait for the expected UI state
- tapOn:
    id: settings_tab_3
    enabled: true
    label: Activate the specified control
- assertVisible:
    id: settings_page
    label: Check the expected UI state
- runFlow:
    file: subflows/home.yaml
    label: Enter the signed-in home without clearing data
- extendedWaitUntil:
    visible:
      id: note_editor
      text: \Q${DRAFT_TEXT}\E
    timeout: 15000
    label: Wait for the expected UI state
- runFlow:
    file: subflows/clear-draft.yaml
    label: Clear only the known navigation draft
