appId: ${APP_ID}
name: Locate the composer or a visible inline editor
onFlowComplete:
- takeScreenshot:
    path: ${SCREENSHOT_PREFIX}-editor-home
    label: Capture the observed editor
---
- runFlow:
    when:
      notVisible:
        id: home
    commands:
    - assertNotVisible:
        id: home
        label: Check whether home is already visible
    - runFlow:
        file: subflows/open-menu.yaml
        label: Open navigation without syncing
    - tapOn:
        id: nav_home
        enabled: true
        label: Return to home
    label: Return from another page before looking for an editor
- scrollUntilVisible:
    element:
      id: note_editor|note_editor_memos/[A-Za-z0-9_-]+
    direction: UP
    timeout: 15000
    centerElement: false
    label: Find the editor without assuming a composer exists
