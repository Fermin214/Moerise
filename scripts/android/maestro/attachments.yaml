appId: ${APP_ID}
name: Cancel the picker then save one note with an exact text attachment
onFlowComplete:
- takeScreenshot:
    path: ${SCREENSHOT_PREFIX}-attachments-final
    label: Capture the isolated test UI
---
- runFlow:
    file: attachment-cancel.yaml
    label: Cover picker cancellation without changing a draft
- assertVisible:
    id: note_editor_empty
    label: Check the expected UI state
- tapOn:
    id: note_editor
    enabled: true
    label: Activate the specified control
- inputText:
    text: ${ATTACHMENT_NOTE_TEXT}
    label: Enter the supplied ASCII fixture value
- runFlow:
    commands:
    - hideKeyboard
    label: Dismiss the keyboard
- extendedWaitUntil:
    visible:
      id: note_editor
      text: \Q${ATTACHMENT_NOTE_TEXT}\E
    timeout: 15000
    label: Wait for the expected UI state
- extendedWaitUntil:
    visible:
      id: add_attachment
      enabled: true
    timeout: 15000
    label: Wait for the expected UI state
- tapOn:
    id: add_attachment
    enabled: true
    label: Activate the specified control
- runFlow:
    file: subflows/pick-download.yaml
    label: Select the unique txt file from the supported system provider
- extendedWaitUntil:
    visible:
      id: note_editor
      text: \Q${ATTACHMENT_NOTE_TEXT}\E
    timeout: 15000
    label: Wait for the expected UI state
- extendedWaitUntil:
    visible:
      text: \Q${ATTACHMENT_NAME}\E
    timeout: 15000
    label: Wait for the expected UI state
- takeScreenshot:
    path: ${SCREENSHOT_PREFIX}-attachment-staged
    label: Capture the isolated test UI
- extendedWaitUntil:
    visible:
      id: save_note
      enabled: true
    timeout: 15000
    label: Wait for the expected UI state
- tapOn:
    id: save_note
    enabled: true
    label: Activate the specified control
- extendedWaitUntil:
    visible:
      id: note_editor_empty
    timeout: 15000
    label: Wait for the expected UI state
- scrollUntilVisible:
    element:
      text: \Q${ATTACHMENT_NOTE_TEXT}\E
    direction: DOWN
    timeout: 15000
    centerElement: false
    label: Locate the specified control without coordinates
- assertVisible:
    text: \Q${ATTACHMENT_NOTE_TEXT}\E
    label: Check the expected UI state
- assertVisible:
    text: \Q${ATTACHMENT_NAME}\E
    label: Check the expected UI state
- takeScreenshot:
    path: ${SCREENSHOT_PREFIX}-attachment-saved
    label: Capture the isolated test UI
- runFlow:
    file: subflows/home.yaml
    label: Enter the signed-in home without clearing data
