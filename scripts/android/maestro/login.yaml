appId: ${APP_ID}
name: Fixture login or authenticated session
onFlowComplete:
- takeScreenshot:
    path: ${SCREENSHOT_PREFIX}-login-final
    label: Capture the isolated test UI
---
- runFlow:
    file: subflows/ensure-login.yaml
    label: Check or establish the fixture session
- runFlow:
    file: subflows/home.yaml
    label: Enter the signed-in home without clearing data
- extendedWaitUntil:
    visible:
      id: note_editor
    timeout: 15000
    label: Wait for the expected UI state
- assertNotVisible:
    id: server_login
    label: Check the expected UI state
- assertNotVisible:
    id: welcome_enter
    label: Check that the welcome choice was remembered
- takeScreenshot:
    path: ${SCREENSHOT_PREFIX}-login-home
    label: Capture the isolated test UI
