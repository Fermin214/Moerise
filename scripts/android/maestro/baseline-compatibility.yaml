appId: ${APP_ID}
name: Use the baseline APK against the new Core
onFlowComplete:
- takeScreenshot:
    path: ${SCREENSHOT_PREFIX}-final
    label: Capture the baseline APK after returning home
---
- extendedWaitUntil:
    visible:
      id: welcome_enter
    timeout: 15000
    label: Wait for the baseline welcome screen
- assertVisible:
    id: privacy_share
    checked: false
    label: Require explicit consent for statistics
- tapOn:
    id: privacy_share
    enabled: true
    label: Enable statistics for the isolated receiver
- assertVisible:
    id: privacy_share
    checked: true
    label: Verify the baseline consent switch
- tapOn:
    id: welcome_enter
    enabled: true
    label: Enter the baseline app with statistics enabled
- runFlow:
    file: subflows/ensure-login.yaml
    label: Sign in to the isolated HTTPS fixture
- runFlow:
    file: subflows/release-note.yaml
    label: Save a baseline note
- runFlow:
    file: subflows/home.yaml
    label: Sync the baseline timeline
- scrollUntilVisible:
    element:
      id: note_card_${PEER_NOTE_NAME}
    direction: DOWN
    timeout: 65000
    centerElement: true
    label: Locate the comparison note in the synced timeline
- tapOn:
    id: open_search
    enabled: true
    label: Open baseline search
- extendedWaitUntil:
    visible:
      id: search_query_empty
    timeout: 15000
    label: Wait for the empty search field
- tapOn:
    text: 关键词|Keyword
    enabled: true
    label: Open baseline search modes
- extendedWaitUntil:
    visible:
      text: 混合|Hybrid
    timeout: 15000
    label: Wait for the server-backed hybrid mode
- tapOn:
    text: 混合|Hybrid
    enabled: true
    label: Select hybrid search to exercise the Core response
- tapOn:
    id: search_query
    enabled: true
    label: Focus the search field
- inputText:
    text: ${QUERY_TEXT}${INPUT_SUFFIX}
    label: Enter the exact fixture query
- eraseText:
    charactersToErase: 1
    label: Remove the input suffix
- pressKey:
    key: Enter
    label: Submit baseline hybrid search
- runFlow:
    file: subflows/hide-keyboard.yaml
    label: Expose the search result body below the composer
- extendedWaitUntil:
    visible:
      text: 搜索结果按相关度排列。|Search results are ranked by relevance\.
    timeout: 65000
    label: Require a hybrid response rather than keyword fallback
- scrollUntilVisible:
    element:
      text: \Q${NOTE_TEXT}\E
      childOf:
        id: note_card_${NOTE_NAME}
    direction: DOWN
    timeout: 65000
    centerElement: false
    label: Bring the baseline search result body into view
- assertVisible:
    text: \Q${NOTE_TEXT}\E
    childOf:
      id: note_card_${NOTE_NAME}
    label: Verify the baseline client displays the matching result body
- takeScreenshot:
    path: ${SCREENSHOT_PREFIX}-search
    label: Capture the baseline search result
- tapOn:
    id: search_close
    enabled: true
    label: Close baseline search
- runFlow:
    file: subflows/open-menu.yaml
    label: Open baseline navigation
- scrollUntilVisible:
    element:
      id: nav_review
    direction: DOWN
    timeout: 15000
    centerElement: true
    label: Locate the review destination
- tapOn:
    id: nav_review
    enabled: true
    label: Open the baseline review
- scrollUntilVisible:
    element:
      id: review_next
      enabled: true
    timeout: 65000
    direction: DOWN
    centerElement: false
    label: Require a populated review
- tapOn:
    id: review_next
    enabled: true
    label: Advance to another review item
- extendedWaitUntil:
    visible:
      id: review_walk
      enabled: true
    timeout: 15000
    label: Require a readable review note
- takeScreenshot:
    path: ${SCREENSHOT_PREFIX}-review
    label: Capture the baseline review note
- tapOn:
    id: review_walk
    enabled: true
    label: Start walking from the review note
- scrollUntilVisible:
    element:
      id: walk_next
      enabled: true
    timeout: 65000
    direction: DOWN
    centerElement: false
    label: Require a walk result with another step available
- assertNotVisible:
    id: discovery_error
    label: Require the baseline client to render the walk without an error
- takeScreenshot:
    path: ${SCREENSHOT_PREFIX}-walk
    label: Capture the baseline walk result
- tapOn:
    id: walk_end
    enabled: true
    label: End the walk
- runFlow:
    file: subflows/open-menu.yaml
    label: Open navigation to stargazing
- scrollUntilVisible:
    element:
      id: nav_map
    direction: DOWN
    timeout: 15000
    centerElement: true
    label: Locate the stargazing destination
- tapOn:
    id: nav_map
    enabled: true
    label: Open the baseline star map
- extendedWaitUntil:
    visible:
      id: map_fit
      enabled: true
    timeout: 65000
    label: Require a readable star snapshot
- assertNotVisible:
    id: map_status
    label: Require the star map to finish loading without an error
- tapOn:
    id: map_fit
    enabled: true
    label: Fit the published stars in the baseline app
- takeScreenshot:
    path: ${SCREENSHOT_PREFIX}-stars
    label: Capture the baseline star map
- runFlow:
    file: subflows/home.yaml
    label: Return the baseline app to the synced editor
