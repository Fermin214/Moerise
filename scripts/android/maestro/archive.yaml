appId: ${APP_ID}
name: Archive and restore the dedicated note
onFlowComplete:
- takeScreenshot:
    path: ${SCREENSHOT_PREFIX}-archive-final
    label: Capture the isolated test UI
---
- runFlow:
    file: subflows/home.yaml
    label: Enter the signed-in home without clearing data
- scrollUntilVisible:
    element:
      id: note_card_${NOTE_NAME}
    direction: DOWN
    timeout: 15000
    centerElement: true
    label: Locate the specified control without coordinates
- tapOn:
    id: note_more_${NOTE_NAME}
    enabled: true
    label: Activate the specified control
- extendedWaitUntil:
    visible:
      id: archive_note_${NOTE_NAME}
      enabled: true
    timeout: 15000
    label: Wait for the expected UI state
- tapOn:
    id: archive_note_${NOTE_NAME}
    enabled: true
    label: Activate the specified control
- extendedWaitUntil:
    notVisible:
      id: note_card_${NOTE_NAME}
    timeout: 65000
    label: Wait for the expected UI state
- runFlow:
    file: subflows/open-menu.yaml
    label: Open the account navigation
- extendedWaitUntil:
    visible:
      id: account_menu
    timeout: 15000
    label: Wait for the expected UI state
- tapOn:
    id: account_menu
    enabled: true
    label: Activate the specified control
- extendedWaitUntil:
    visible:
      id: nav_archive
    timeout: 15000
    label: Wait for the expected UI state
- tapOn:
    id: nav_archive
    enabled: true
    label: Activate the specified control
- extendedWaitUntil:
    visible:
      id: archive_page
    timeout: 15000
    label: Wait for the expected UI state
- scrollUntilVisible:
    element:
      id: note_card_${NOTE_NAME}
    direction: DOWN
    timeout: 15000
    centerElement: true
    label: Locate the specified control without coordinates
- extendedWaitUntil:
    visible:
      id: note_card_${NOTE_NAME}
    timeout: 15000
    label: Wait for the expected UI state
- takeScreenshot:
    path: ${SCREENSHOT_PREFIX}-archived
    label: Capture the isolated test UI
- tapOn:
    id: note_more_${NOTE_NAME}
    enabled: true
    label: Activate the specified control
- extendedWaitUntil:
    visible:
      id: archive_note_${NOTE_NAME}
      enabled: true
    timeout: 15000
    label: Wait for the expected UI state
- tapOn:
    id: archive_note_${NOTE_NAME}
    enabled: true
    label: Activate the specified control
- extendedWaitUntil:
    notVisible:
      id: note_card_${NOTE_NAME}
    timeout: 65000
    label: Wait for the expected UI state
- runFlow:
    file: subflows/home.yaml
    label: Enter the signed-in home without clearing data
- scrollUntilVisible:
    element:
      id: note_card_${NOTE_NAME}
    direction: DOWN
    timeout: 15000
    centerElement: true
    label: Locate the specified control without coordinates
- extendedWaitUntil:
    visible:
      id: note_card_${NOTE_NAME}
    timeout: 15000
    label: Wait for the expected UI state
- takeScreenshot:
    path: ${SCREENSHOT_PREFIX}-archive-restored
    label: Capture the isolated test UI
