appId: ${APP_ID}
name: Submit keyword and hybrid search and keep note reading on home
onFlowComplete:
- takeScreenshot:
    path: ${SCREENSHOT_PREFIX}-search-final
    label: Capture the isolated test UI
---
- runFlow:
    file: subflows/home.yaml
    label: Enter the signed-in home without clearing data
- scrollUntilVisible:
    element:
      id: note_card_${NOTE_NAME}
    direction: DOWN
    timeout: 65000
    centerElement: true
    label: Locate the specified control without coordinates
- assertVisible:
    id: note_card_${NOTE_NAME}
    label: Check the expected UI state
- scrollUntilVisible:
    element:
      id: note_card_${PEER_NOTE_NAME}
    direction: DOWN
    timeout: 65000
    centerElement: true
    label: Locate the specified control without coordinates
- assertVisible:
    id: note_card_${PEER_NOTE_NAME}
    label: Check the expected UI state
- scrollUntilVisible:
    element:
      id: note_editor
    direction: UP
    timeout: 15000
    centerElement: true
    label: Locate the specified control without coordinates
- tapOn:
    id: open_search
    enabled: true
    label: Activate the specified control
- extendedWaitUntil:
    visible:
      id: search_query
    timeout: 15000
    label: Wait for the expected UI state
- runFlow:
    when:
      notVisible:
        id: search_query_empty
    commands:
    - assertNotVisible:
        id: search_query_empty
        label: Require the known input to contain text
    - longPressOn:
        id: search_query
        enabled: true
        label: Open text selection for the known input
    - runFlow:
        when:
          notVisible:
            text: Select all|Select All|全选
        commands:
        - assertNotVisible:
            text: Select all|Select All|全选
            label: Require the full-selection action to be outside the toolbar
        - assertVisible:
            id: android:id/overflow
            enabled: true
            label: Require the observed Android text toolbar overflow
        - tapOn:
            id: android:id/overflow
            enabled: true
            label: Reveal the remaining text selection actions
        label: Open text toolbar overflow only when full selection is hidden
    - extendedWaitUntil:
        visible:
          text: Select all|Select All|全选
        timeout: 15000
        label: Wait for the text selection action
    - tapOn:
        text: Select all|Select All|全选
        enabled: true
        label: Select the complete fixture input
    - eraseText:
        charactersToErase: 1
        label: Delete the selected fixture text
    label: Clear the known input regardless of caret position
- tapOn:
    id: search_query
    enabled: true
    label: Focus the empty fixture input
- inputText:
    text: ${QUERY_TEXT}
    label: Enter the supplied ASCII fixture value
- pressKey:
    key: Enter
    label: Submit search through the focused IME search field
- runFlow:
    commands:
    - hideKeyboard
    label: Dismiss the keyboard
- extendedWaitUntil:
    visible:
      id: search_query
      text: \Q${QUERY_TEXT}\E
    timeout: 15000
    label: Wait for the expected UI state
- extendedWaitUntil:
    visible:
      id: note_card_${NOTE_NAME}
    timeout: 15000
    label: Wait for the expected UI state
- extendedWaitUntil:
    notVisible:
      id: note_card_${PEER_NOTE_NAME}
    timeout: 15000
    label: Wait for the expected UI state
- assertVisible:
    text: \Q${NOTE_TEXT}\E
    childOf:
      id: note_card_${NOTE_NAME}
    label: Check the expected UI state
- takeScreenshot:
    path: ${SCREENSHOT_PREFIX}-search-filtered
    label: Capture the isolated test UI
- tapOn:
    text: \Q${NOTE_TEXT}\E
    childOf:
      id: note_card_${NOTE_NAME}
    enabled: true
    label: Click only the target note body
- extendedWaitUntil:
    visible:
      id: home
    timeout: 15000
    label: Require the home page after reading a note
- assertVisible:
    id: note_card_${NOTE_NAME}
    label: Require the exact note to remain on home
- assertNotVisible:
    id: detail_back
    label: Reject a note details route after reading
- assertNotVisible:
    id: note_detail
    label: Reject a note details route after reading
- assertNotVisible:
    id: open_note_${NOTE_NAME}
    label: Reject a note details route after reading
- extendedWaitUntil:
    visible:
      text: \d{4}-\d{2}-\d{2} \d{2}:\d{2}
      childOf:
        id: note_card_${NOTE_NAME}
    timeout: 15000
    label: Wait for the target note timestamp
- tapOn:
    text: \d{4}-\d{2}-\d{2} \d{2}:\d{2}
    childOf:
      id: note_card_${NOTE_NAME}
    enabled: true
    label: Click only the target note timestamp
- extendedWaitUntil:
    visible:
      id: home
    timeout: 15000
    label: Require the home page after reading a note
- assertVisible:
    id: note_card_${NOTE_NAME}
    label: Require the exact note to remain on home
- assertNotVisible:
    id: detail_back
    label: Reject a note details route after reading
- assertNotVisible:
    id: note_detail
    label: Reject a note details route after reading
- assertNotVisible:
    id: open_note_${NOTE_NAME}
    label: Reject a note details route after reading
- tapOn:
    id: search_close
    enabled: true
    label: Close keyword search as in the original reading test
- extendedWaitUntil:
    notVisible:
      id: search_query
    timeout: 15000
    label: Require keyword search to close
- tapOn:
    id: open_search
    enabled: true
    label: Reopen search for hybrid coverage
- extendedWaitUntil:
    visible:
      id: search_query
    timeout: 15000
    label: Wait for the reopened search field
- runFlow:
    when:
      notVisible:
        id: search_query_empty
    commands:
    - assertNotVisible:
        id: search_query_empty
        label: Require the known input to contain text
    - longPressOn:
        id: search_query
        enabled: true
        label: Open text selection for the known input
    - runFlow:
        when:
          notVisible:
            text: Select all|Select All|全选
        commands:
        - assertNotVisible:
            text: Select all|Select All|全选
            label: Require the full-selection action to be outside the toolbar
        - assertVisible:
            id: android:id/overflow
            enabled: true
            label: Require the observed Android text toolbar overflow
        - tapOn:
            id: android:id/overflow
            enabled: true
            label: Reveal the remaining text selection actions
        label: Open text toolbar overflow only when full selection is hidden
    - extendedWaitUntil:
        visible:
          text: Select all|Select All|全选
        timeout: 15000
        label: Wait for the text selection action
    - tapOn:
        text: Select all|Select All|全选
        enabled: true
        label: Select the complete fixture input
    - eraseText:
        charactersToErase: 1
        label: Delete the selected fixture text
    label: Clear the known input regardless of caret position
- tapOn:
    id: search_query
    enabled: true
    label: Focus the empty fixture input
- inputText:
    text: ${QUERY_TEXT}
    label: Restore the exact query before changing mode
- pressKey:
    key: Enter
    label: Submit search through the focused IME search field
- runFlow:
    commands:
    - hideKeyboard
    label: Reveal the keyword results after submitting the restored query
- extendedWaitUntil:
    visible:
      id: note_card_${NOTE_NAME}
    timeout: 15000
    label: Require the target keyword result before changing mode
- tapOn:
    text: 关键词|Keyword
    enabled: true
    label: Open the keyword search mode menu
- extendedWaitUntil:
    visible:
      text: 混合|Hybrid
    timeout: 15000
    label: Wait for the hybrid search option
- tapOn:
    text: 混合|Hybrid
    enabled: true
    label: Switch from keyword to hybrid search
- extendedWaitUntil:
    visible:
      text: 混合|Hybrid
    timeout: 15000
    label: Require hybrid mode to be selected
- tapOn:
    id: search_query
    enabled: true
    label: Refocus the search field before submitting hybrid
- pressKey:
    key: Enter
    label: Submit search through the focused IME search field
- runFlow:
    commands:
    - hideKeyboard
    label: Dismiss the keyboard after hybrid submission
- extendedWaitUntil:
    visible:
      id: note_card_${NOTE_NAME}
    timeout: 15000
    label: Require the target hybrid result
- assertVisible:
    text: \Q${NOTE_TEXT}\E
    childOf:
      id: note_card_${NOTE_NAME}
    label: Check the hybrid result body
- takeScreenshot:
    path: ${SCREENSHOT_PREFIX}-search-hybrid
    label: Capture the hybrid search result
- runFlow:
    when:
      notVisible:
        id: search_query_empty
    commands:
    - assertNotVisible:
        id: search_query_empty
        label: Require the known input to contain text
    - longPressOn:
        id: search_query
        enabled: true
        label: Open text selection for the known input
    - runFlow:
        when:
          notVisible:
            text: Select all|Select All|全选
        commands:
        - assertNotVisible:
            text: Select all|Select All|全选
            label: Require the full-selection action to be outside the toolbar
        - assertVisible:
            id: android:id/overflow
            enabled: true
            label: Require the observed Android text toolbar overflow
        - tapOn:
            id: android:id/overflow
            enabled: true
            label: Reveal the remaining text selection actions
        label: Open text toolbar overflow only when full selection is hidden
    - extendedWaitUntil:
        visible:
          text: Select all|Select All|全选
        timeout: 15000
        label: Wait for the text selection action
    - tapOn:
        text: Select all|Select All|全选
        enabled: true
        label: Select the complete fixture input
    - eraseText:
        charactersToErase: 1
        label: Delete the selected fixture text
    label: Clear the known input regardless of caret position
- tapOn:
    id: search_query
    enabled: true
    label: Focus the empty fixture input
- pressKey:
    key: Enter
    label: Submit search through the focused IME search field
- runFlow:
    commands:
    - hideKeyboard
    label: Dismiss the keyboard
- extendedWaitUntil:
    visible:
      id: search_query_empty
    timeout: 15000
    label: Wait for the expected UI state
- extendedWaitUntil:
    visible:
      id: note_card_${PEER_NOTE_NAME}
    timeout: 15000
    label: Wait for the expected UI state
- extendedWaitUntil:
    visible:
      id: note_card_${NOTE_NAME}
    timeout: 15000
    label: Wait for the expected UI state
- tapOn:
    id: search_close
    enabled: true
    label: Activate the specified control
- extendedWaitUntil:
    notVisible:
      id: search_query
    timeout: 15000
    label: Wait for the expected UI state
- runFlow:
    file: subflows/home.yaml
    label: Enter the signed-in home without clearing data
- scrollUntilVisible:
    element:
      id: note_card_${NOTE_NAME}
    direction: DOWN
    timeout: 65000
    centerElement: true
    label: Locate the dedicated note after the final home navigation
- extendedWaitUntil:
    visible:
      id: note_card_${NOTE_NAME}
    timeout: 15000
    label: Require the original test note after returning home
- assertVisible:
    text: \Q${NOTE_TEXT}\E
    childOf:
      id: note_card_${NOTE_NAME}
    label: Verify the original note body after returning home
- assertVisible:
    id: home
    label: Verify the final page remains home
