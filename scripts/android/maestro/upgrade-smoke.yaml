appId: ${APP_ID}
name: Preserve the upgraded session and local editor
onFlowComplete:
- takeScreenshot:
    path: ${SCREENSHOT_PREFIX}-upgrade-final
    label: Capture the upgraded application
---
- launchApp:
    clearState: false
    stopApp: false
    label: Foreground the upgraded app
- extendedWaitUntil:
    visible:
      id: open_menu
    timeout: 15000
    label: Require the restored account toolbar
- assertNotVisible:
    id: server_login
    label: Require the stored session
- assertNotVisible:
    id: welcome_enter
    label: Require the stored privacy choice
- tapOn:
    id: note_editor
    enabled: true
    label: Focus the restored draft
- extendedWaitUntil:
    visible:
      id: note_editor
      focused: true
    timeout: 15000
    label: Require an editable restored draft
- runFlow:
    file: subflows/open-menu.yaml
    label: Open navigation for synchronization
- extendedWaitUntil:
    visible:
      id: sidebar_sync
      enabled: true
    timeout: 15000
    label: Require the manual synchronization control
- tapOn:
    id: sidebar_sync
    enabled: true
    label: Synchronize using the restored session
- extendedWaitUntil:
    visible:
      id: note_editor
    timeout: 15000
    label: Return to the restored draft
- assertNotVisible:
    id: server_login
    label: Require synchronization without another login
