appId: ${APP_ID}
name: Verify the phone reads the dedicated test service before mutations
onFlowComplete:
- takeScreenshot:
    path: ${SCREENSHOT_PREFIX}-test-source
    label: Capture the service identity probe
---
- assertNotVisible:
    id: open_menu
    label: Require a signed-out device before entering test credentials
- assertVisible:
    id: server_origin_empty
    label: Require an empty server field before entering the test source
- runFlow:
    file: subflows/ensure-login.yaml
    label: Sign into the designated test service
- runFlow:
    file: subflows/open-menu.yaml
    label: Open the navigation drawer without syncing
- runFlow:
    when:
      notVisible:
        id: account_menu
        text: \Q${EXPECTED_ACCOUNT}\E
    commands:
    - assertNotVisible:
        id: account_menu
        text: \Q${EXPECTED_ACCOUNT}\E
        label: Check whether the account row exposes a separate text node
    - assertVisible:
        text: \Q${EXPECTED_ACCOUNT}\E
        childOf:
          id: account_menu
        label: Require the verified server account before any sync
    label: Match the test account even if the text is a child node
- tapOn:
    id: nav_home
    enabled: true
    label: Reset archive and search filters in the verified account
- runFlow:
    file: subflows/open-menu.yaml
    label: Reopen navigation before syncing from home
- tapOn:
    id: sidebar_sync
    enabled: true
    label: Sync after signing into the designated source and checking its account
- extendedWaitUntil:
    visible:
      id: home
    timeout: 15000
    label: Wait for home without requiring the composer
- scrollUntilVisible:
    element:
      id: note_card_${NOTE_NAME}|note_editor|note_editor_memos/[A-Za-z0-9_-]+
    direction: UP
    timeout: 15000
    centerElement: false
    label: Reset list position toward the newest note
- runFlow:
    when:
      notVisible:
        id: note_card_${NOTE_NAME}
    commands:
    - assertNotVisible:
        id: note_card_${NOTE_NAME}
        label: Check whether the exact marker is already visible
    - scrollUntilVisible:
        element:
          id: note_card_${NOTE_NAME}
        direction: DOWN
        timeout: 65000
        centerElement: false
        label: Find the marker below the editor
    label: Scroll to the marker only when it is below the visible editor
- assertVisible:
    text: \Q${NOTE_TEXT}\E
    childOf:
      id: note_card_${NOTE_NAME}
    label: Verify the exact test service marker before any UI writes
