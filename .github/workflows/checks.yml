name: Checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [full, android-device]
        default: full
      suite:
        type: choice
        options: [all, ui, editing, search, actions, insights, navigation, attachments, language, home, lifecycle, ime, recovery, stars]
        default: all
      fixture_run:
        description: Reuse fixture APKs from this workflow run
        type: string
        default: ''

permissions:
  contents: read
  actions: read

jobs:
  scope:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    outputs:
      android: ${{ steps.scope.outputs.android }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
      - name: Detect changes covered by Android checks
        id: scope
        run: |
          files=$(git diff --name-only HEAD^1 HEAD -- \
            mobile scripts/android docs/android internal main.go go.mod go.sum \
            web/server.mjs .github/workflows/checks.yml .github/workflows/android-checks.yml)
          if [[ -n "$files" ]]; then
            echo 'android=true' >> "$GITHUB_OUTPUT"
          else
            echo 'android=false' >> "$GITHUB_OUTPUT"
          fi
  go:
    if: inputs.mode != 'android-device'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # v6.1.0
        with:
          go-version: "1.27.x"
      - name: Verify modules and formatting
        shell: bash
        run: |
          go mod verify
          test -z "$(gofmt -l main.go internal tests)"
      - run: go vet ./...
      - run: go test ./... -count=1
      - name: Build without cgo
        env:
          CGO_ENABLED: "0"
        run: go build -trimpath -o build/moerise .
      - name: Check races
        run: go test -race ./... -count=1 -timeout=30m
      - name: Check vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: Start private layout service
        run: |
          docker build -t moerise-layout:checks services/layout
          docker run -d --name moerise-layout --cpus=1 --memory=1g \
            -p 127.0.0.1:8766:8766 moerise-layout:checks
      - name: Run Memos acceptance scenarios
        run: go test -tags=integration ./tests -v -count=1
  web:
    if: inputs.mode != 'android-device'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@v6.5.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - run: npm --prefix web run build
      - run: npm --prefix web test
      - run: node --test scripts/lib/*.test.mjs
      - name: Verify preinstalled Chrome
        run: google-chrome --version
      - name: Run browser suites
        env:
          MOERISE_PLAYWRIGHT_MODULE: ${{ github.workspace }}/web/node_modules/playwright/index.mjs
          MOERISE_PLAYWRIGHT_CHANNEL: chrome
        run: npm --prefix web run test:browser
  android-pr:
    needs: scope
    if: needs.scope.outputs.android == 'true'
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/android-checks.yml
    with:
      mode: full
  pr-gate:
    name: PR gate
    if: ${{ always() && github.event_name == 'pull_request' }}
    needs: [scope, go, web, android-pr]
    runs-on: ubuntu-24.04
    env:
      SCOPE_RESULT: ${{ needs.scope.result }}
      GO_RESULT: ${{ needs.go.result }}
      WEB_RESULT: ${{ needs.web.result }}
      ANDROID_REQUIRED: ${{ needs.scope.outputs.android }}
      ANDROID_RESULT: ${{ needs.android-pr.result }}
    steps:
      - name: Require all applicable checks
        run: |
          printf 'Scope: %s\nGo: %s\nWeb: %s\nAndroid required: %s\nAndroid: %s\n' \
            "$SCOPE_RESULT" "$GO_RESULT" "$WEB_RESULT" "$ANDROID_REQUIRED" "$ANDROID_RESULT"
          [[ "$SCOPE_RESULT" == success && "$GO_RESULT" == success && "$WEB_RESULT" == success ]]
          [[ ( "$ANDROID_REQUIRED" == true && "$ANDROID_RESULT" == success ) ||
             ( "$ANDROID_REQUIRED" == false && "$ANDROID_RESULT" == skipped ) ]]
  android-device:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'android-device'
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/android-checks.yml
    with:
      mode: device
      suite: ${{ inputs.suite }}
      fixture_run: ${{ inputs.fixture_run }}
