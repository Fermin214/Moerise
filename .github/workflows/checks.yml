name: Checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [full, android-device]
        default: full
      suite:
        type: choice
        options: [all, records, records-edits, records-browse, explore, ui, editing, search, actions, navigation, attachments, language, home, lifecycle, ime, recovery, stars]
        default: all
      fixture_run:
        description: Reuse fixture APKs from this workflow run
        type: string
        default: ''

permissions:
  contents: read
  actions: read

concurrency:
  group: checks-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scope:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    outputs:
      go: ${{ steps.scope.outputs.go }}
      web: ${{ steps.scope.outputs.web }}
      android: ${{ steps.scope.outputs.android }}
      android_mode: ${{ steps.scope.outputs.android_mode }}
      linux_release: ${{ steps.scope.outputs.linux_release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
      - name: Select applicable checks
        id: scope
        shell: bash
        run: |
          select_check() {
            local name=$1 files
            shift
            files=$(git diff --name-only HEAD^1 HEAD -- "$@")
            if [[ -n "$files" ]]; then
              echo "$name=true" >> "$GITHUB_OUTPUT"
            else
              echo "$name=false" >> "$GITHUB_OUTPUT"
            fi
          }
          core=(internal main.go go.mod go.sum ':(top,glob)web/*.go' scripts/testweb cmd/moerise-telemetry)
          release=(scripts/release .github/workflows/{checks,main-smoke,publish}.yml)
          select_check go "${core[@]}" ':(top,glob)*.go' tests services/layout .github/workflows/checks.yml
          select_check web web scripts/lib ':(top,glob)scripts/acceptance/*.mjs' .github/workflows/checks.yml
          android_mode=$(git diff --no-renames --name-only -z HEAD^1 HEAD | python3 scripts/android/ci-scope.py)
          echo "android_mode=$android_mode" >> "$GITHUB_OUTPUT"
          if [[ "$android_mode" == none ]]; then
            echo "android=false" >> "$GITHUB_OUTPUT"
          else
            echo "android=true" >> "$GITHUB_OUTPUT"
          fi
          select_check linux_release "${release[@]}" "${core[@]}" web services/layout \
            Dockerfile .dockerignore .env.example config.example.json LICENSE \
            docs/{OPERATIONS,STARGAZING}.md .github/workflows/release.yml
      - name: Check release guards
        if: steps.scope.outputs.linux_release == 'true' || steps.scope.outputs.android == 'true'
        run: python3 -B -m unittest discover -s scripts/release -p 'test_*.py'
  go-suites:
    needs: scope
    if: ${{ !cancelled() && (needs.scope.outputs.go == 'true' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'full')) }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: [build, race, integration]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # v6.1.0
        with:
          go-version: "1.27.x"
      - uses: actions/setup-node@v6.5.0
        with:
          node-version: "24"
      - run: npm --prefix web run build
      - name: Verify modules and formatting
        if: matrix.suite == 'build'
        shell: bash
        run: |
          go mod verify
          test -z "$(gofmt -l main.go internal tests web/*.go scripts/testweb)"
      - run: go vet ./...
        if: matrix.suite == 'build'
      - run: go test ./... -count=1
        if: matrix.suite == 'build'
      - name: Build without cgo
        if: matrix.suite == 'build'
        env:
          CGO_ENABLED: "0"
        run: go build -trimpath -o build/moerise .
      - name: Check races
        if: matrix.suite == 'race'
        run: go test -race ./... -count=1 -timeout=30m
      - name: Check vulnerabilities
        if: matrix.suite == 'build'
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: Start private layout service
        if: matrix.suite == 'integration'
        run: |
          docker build -t moerise-layout:checks services/layout
          docker run -d --name moerise-layout --cpus=1 --memory=1g \
            -p 127.0.0.1:8766:8766 moerise-layout:checks
      - name: Run Memos acceptance scenarios
        if: matrix.suite == 'integration'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/v030"
          gh release download v0.3.0 --pattern moerise_0.3.0_linux_amd64.tar.gz --dir "$RUNNER_TEMP/v030"
          tar -xzf "$RUNNER_TEMP/v030/moerise_0.3.0_linux_amd64.tar.gz" -C "$RUNNER_TEMP/v030"
          export MOERISE_V030_BINARY="$RUNNER_TEMP/v030/moerise_0.3.0_linux_amd64/moerise"
          test -x "$MOERISE_V030_BINARY"
          go test -tags=integration ./tests -v -count=1
  go:
    needs: [scope, go-suites]
    if: ${{ always() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Require applicable Go suites
        env:
          REQUIRED: ${{ needs.scope.outputs.go }}
          RESULT: ${{ needs.go-suites.result }}
        run: |
          [[ ( "$REQUIRED" == true && "$RESULT" == success ) || ( "$REQUIRED" == false && "$RESULT" == skipped ) ]]
  web:
    needs: scope
    if: ${{ !cancelled() && (needs.scope.outputs.web == 'true' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'full')) }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@v6.5.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c
        with:
          go-version: "1.27.x"
      - run: npm --prefix web ci
      - run: npm --prefix web run build
      - run: npm --prefix web test
      - run: node --test scripts/lib/*.test.mjs scripts/android/fixture-policy.test.mjs
      - name: Verify preinstalled Chrome
        run: google-chrome --version
      - name: Run browser suites
        env:
          MOERISE_PLAYWRIGHT_MODULE: ${{ github.workspace }}/web/node_modules/playwright/index.mjs
          MOERISE_PLAYWRIGHT_CHANNEL: chrome
        run: npm --prefix web run test:browser
  android-pr:
    needs: scope
    if: needs.scope.outputs.android_mode != 'none'
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/android-checks.yml
    with:
      mode: ${{ needs.scope.outputs.android_mode }}
  linux-preview:
    needs: scope
    if: needs.scope.outputs.linux_release == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/release.yml
  pr-gate:
    name: PR gate
    if: ${{ always() && github.event_name == 'pull_request' }}
    needs: [scope, go, web, android-pr, linux-preview]
    runs-on: ubuntu-24.04
    env:
      SCOPE_RESULT: ${{ needs.scope.result }}
      GO_RESULT: ${{ needs.go.result }}
      WEB_REQUIRED: ${{ needs.scope.outputs.web }}
      WEB_RESULT: ${{ needs.web.result }}
      ANDROID_REQUIRED: ${{ needs.scope.outputs.android }}
      ANDROID_RESULT: ${{ needs.android-pr.result }}
      LINUX_REQUIRED: ${{ needs.scope.outputs.linux_release }}
      LINUX_RESULT: ${{ needs.linux-preview.result }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Require all applicable checks
        run: python3 scripts/android/ci-pr-gate.py
  android-device:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'android-device'
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/android-checks.yml
    with:
      mode: device
      suite: ${{ inputs.suite }}
      fixture_run: ${{ inputs.fixture_run }}
