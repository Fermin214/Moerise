name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # v6.1.0
        with:
          go-version: "1.27.x"
      - name: Verify modules and formatting
        shell: bash
        run: |
          go mod verify
          test -z "$(gofmt -l main.go internal tests)"
      - run: go vet ./...
      - run: go test ./... -count=1
      - name: Build without cgo
        env:
          CGO_ENABLED: "0"
        run: go build -trimpath -o build/moerise .
      - name: Check races
        run: go test -race ./... -count=1
      - name: Check vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: Run Memos acceptance scenarios
        run: go test -tags=integration ./tests -v -count=1
