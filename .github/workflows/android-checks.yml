name: Android checks
on:
  workflow_dispatch:
    inputs:
      refresh_dependencies:
        description: Generate dependency checksums and license inventory
        type: boolean
        default: false
      mode:
        type: choice
        options: [full, device, build, host]
        default: full
      suite:
        type: choice
        options: [all, records, records-edits, records-browse, explore, ui, editing, search, actions, navigation, attachments, language, home, lifecycle, ime, recovery, stars]
        default: all
      fixture_run:
        description: Reuse fixture APKs from this workflow run
        type: string
        default: ''
  workflow_call:
    inputs:
      mode:
        type: string
        default: device
      suite:
        type: string
        default: all
      fixture_run:
        type: string
        default: ''
permissions:
  contents: read
  actions: read
concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}-${{ inputs.mode || 'full' }}-${{ inputs.suite || 'all' }}
  cancel-in-progress: true
env:
  MOERISE_ANDROID_CI_BUILD: '1'
jobs:
  core:
    name: ${{ inputs.mode == 'host' && 'Linux acceptance host' || 'Fixture Core' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Check Android acceptance harness
        run: &host-tests |
          python -m pip install --disable-pip-version-check -r scripts/android/maestro/requirements.txt
          python -B scripts/android/maestro/validate.py
          python -B scripts/android/ci-scope.test.py
          python -B scripts/android/device-suites.test.py
          python -B scripts/android/device-transport.test.py
          python -B scripts/android/fixture-artifacts.test.py
          python -B scripts/android/maestro-runner.test.py
          python -B scripts/android/phone-session.test.py
          python -B scripts/android/device-recovery.test.py
      - uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c
        if: inputs.mode != 'host'
        with:
          go-version: "1.27.x"
      - run: go build -p 2 -o "$RUNNER_TEMP/moerise" .
        if: inputs.mode != 'host'
        env:
          GOMAXPROCS: '2'
      - uses: actions/upload-artifact@v4
        if: inputs.mode != 'host'
        with:
          name: android-fixture-core
          path: ${{ runner.temp }}/moerise
  windows-acceptance:
    name: Windows acceptance host
    runs-on: windows-latest
    timeout-minutes: 5
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Check Android acceptance harness
        shell: bash
        run: *host-tests
      - name: Check PowerShell argument forwarding
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $entry = './scripts/android/verify-phone.ps1'
          $help = & $entry --help | Out-String
          if ($LASTEXITCODE -ne 0 -or $help -notmatch '--sessions-root') { throw 'Expected help and exit 0' }
          $failure = & $entry --check invalid-ci-check 2>&1 | Out-String
          if ($LASTEXITCODE -ne 2 -or $failure -notmatch 'invalid-ci-check') { throw 'Expected forwarded check and exit 2' }
          exit 0
  fixture:
    if: inputs.mode != 'build' && inputs.mode != 'host'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      suites: ${{ steps.suites.outputs.value }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - id: suites
        name: Select device suites
        env:
          SUITE: ${{ inputs.suite || 'all' }}
        run: |
          python3 - <<'PY'
          import os, subprocess
          command = ['python3', 'scripts/android/device-suites.py', os.environ['SUITE']]
          selected = subprocess.check_output(command + ['--matrix'], text=True).strip()
          members = subprocess.check_output(command, text=True).splitlines()
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('value=' + selected + '\n')
              output.write('upgrade=' + str('recovery' in members).lower() + '\n')
          PY
      - uses: actions/download-artifact@v4
        if: inputs.fixture_run != ''
        with:
          name: android-fixture-apks
          path: .
          run-id: ${{ inputs.fixture_run }}
          github-token: ${{ github.token }}
      - uses: actions/setup-java@v4
        id: java
        if: inputs.fixture_run == ''
        with:
          distribution: temurin
          java-version: '17'
      - id: sources
        if: inputs.fixture_run == ''
        run: echo "sha=$(python3 scripts/android/fixture-artifacts.py source-digest)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: apks
        if: inputs.fixture_run == ''
        with:
          path: |
            .local/android/fixture-artifacts.json
            .local/android/fixture-upgrade.apk
            mobile/androidApp/build/outputs/apk/fixture/androidApp-fixture.apk
            mobile/androidApp/build/outputs/apk/androidTest/fixture/androidApp-fixture-androidTest.apk
          key: fixture-apks-upgrade-${{ runner.os }}-${{ runner.arch }}-api36-tools36.0.0-temurin${{ steps.java.outputs.version }}-${{ steps.sources.outputs.sha }}-${{ hashFiles('scripts/android/fixture-artifacts.py') }}
      - uses: actions/cache/restore@v4
        if: inputs.fixture_run == '' && steps.apks.outputs.cache-hit != 'true'
        with:
          path: &gradle-home |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: &gradle-key ${{ runner.os }}-android-gradle-${{ hashFiles('mobile/**/*.gradle.kts', 'mobile/gradle.properties', 'mobile/gradle/libs.versions.toml', 'mobile/gradle/verification-metadata.xml', 'mobile/gradle/wrapper/gradle-wrapper.properties') }}-${{ hashFiles('mobile/**/src/**') }}
          restore-keys: &gradle-prefix |
            ${{ runner.os }}-android-gradle-
            setup-java-${{ runner.os }}-x64-gradle-${{ hashFiles('mobile/**/*.gradle.kts', 'mobile/gradle.properties', 'mobile/gradle/libs.versions.toml', 'mobile/gradle/verification-metadata.xml', 'mobile/gradle/wrapper/gradle-wrapper.properties') }}
            setup-java-${{ runner.os }}-x64-gradle-
      - uses: android-actions/setup-android@v3
        if: inputs.fixture_run == '' && steps.apks.outputs.cache-hit != 'true'
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
        if: inputs.fixture_run == '' && steps.apks.outputs.cache-hit != 'true'
      - name: Build fixture APKs once
        if: inputs.fixture_run == '' && steps.apks.outputs.cache-hit != 'true'
        run: |
          source scripts/android/environment.sh
          mkdir -p .local/android
          android_gradle -PmoeriseVersionCode=1 :androidApp:assembleFixture :androidApp:assembleFixtureAndroidTest
          cp mobile/androidApp/build/outputs/apk/fixture/androidApp-fixture.apk "$RUNNER_TEMP/fixture-base.apk"
          android_gradle -PmoeriseVersionCode=2 :androidApp:assembleFixture
          mv mobile/androidApp/build/outputs/apk/fixture/androidApp-fixture.apk .local/android/fixture-upgrade.apk
          mv "$RUNNER_TEMP/fixture-base.apk" mobile/androidApp/build/outputs/apk/fixture/androidApp-fixture.apk
          python3 scripts/android/fixture-artifacts.py write --upgrade-apk .local/android/fixture-upgrade.apk
      - name: Verify fixture APKs before distribution
        env:
          REQUIRE_UPGRADE: ${{ steps.suites.outputs.upgrade }}
        run: |
          args=()
          if [[ "$REQUIRE_UPGRADE" == true ]]; then
            args+=(--require-upgrade --upgrade-apk .local/android/fixture-upgrade.apk)
          fi
          python3 scripts/android/fixture-artifacts.py verify "${args[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: android-fixture-apks
          include-hidden-files: true
          path: |
            .local/android/fixture-artifacts.json
            .local/android/fixture-upgrade.apk
            mobile/androidApp/build/outputs/apk/fixture/androidApp-fixture.apk
            mobile/androidApp/build/outputs/apk/androidTest/fixture/androidApp-fixture-androidTest.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-fixture-target
          include-hidden-files: true
          path: |
            .local/android/fixture-artifacts.json
            mobile/androidApp/build/outputs/apk/fixture/androidApp-fixture.apk
      - uses: actions/upload-artifact@v4
        if: steps.suites.outputs.upgrade == 'true'
        with:
          name: android-fixture-upgrade
          include-hidden-files: true
          path: .local/android/fixture-upgrade.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-fixture-tests
          path: mobile/androidApp/build/outputs/apk/androidTest/fixture/androidApp-fixture-androidTest.apk
  device:
    needs: [fixture, core]
    if: inputs.mode != 'build' && inputs.mode != 'host'
    name: Device (${{ matrix.suite }})
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(needs.fixture.outputs.suites) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Mark target APK download start
        run: |
          date -u '+Target APK download start %Y-%m-%dT%H:%M:%S.%NZ'
          echo "TARGET_DOWNLOAD_START=$(date +%s%N)" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          name: android-fixture-target
          path: .
      - name: Mark first step after target APK download
        if: always() && env.TARGET_DOWNLOAD_START != ''
        run: |
          date -u '+First step after target APK download %Y-%m-%dT%H:%M:%S.%NZ'
          echo "Elapsed between runner checkpoints: $(( ($(date +%s%N) - TARGET_DOWNLOAD_START) / 1000000 )) ms"
      - uses: actions/download-artifact@v4
        if: contains(fromJSON('["records-edits","records","recovery"]'), matrix.suite)
        with:
          name: android-fixture-upgrade
          path: .local/android
      - uses: actions/download-artifact@v4
        if: contains(fromJSON('["records-edits","records-browse","records","explore","lifecycle","ime","recovery","stars"]'), matrix.suite)
        with:
          name: android-fixture-tests
          path: mobile/androidApp/build/outputs/apk/androidTest/fixture
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/moerise-maestro/2.12.1/maestro.zip
          key: android-maestro-2.12.1-${{ runner.os }}-${{ runner.arch }}-54dbb071
      - name: Install Maestro CLI 2.12.1
        run: |
          bash scripts/android/install-maestro.sh
          python3 -m pip install --disable-pip-version-check -r scripts/android/maestro/requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: android-fixture-core
          path: ${{ runner.temp }}/fixture
      - uses: actions/setup-node@v6.5.0
        with:
          node-version: "24"
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Check device suite
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808
        env:
          MOERISE_ANDROID_SUITE: ${{ matrix.suite }}
          MOERISE_ANDROID_UPGRADE_APK: ${{ contains(fromJSON('["records-edits","records","recovery"]'), matrix.suite) && '.local/android/fixture-upgrade.apk' || '' }}
          MOERISE_ANDROID_SKIP_BUILD: '1'
          MOERISE_ANDROID_RETRY_TRANSPORT: '1'
          MOERISE_ANDROID_FIXTURE_BINARY: ${{ runner.temp }}/fixture/moerise
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash scripts/android/ci-device-check.sh
      - name: Summarize device results
        if: always()
        env:
          SUITE: ${{ matrix.suite }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          result = Path('.local/android/device-results.tsv')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as output:
              output.write('### Device: ' + os.environ['SUITE'] + '\n\n')
              retries = sorted(path.name.removesuffix('-attempt-2.json')
                               for path in (result.parent / 'device-transport' / os.environ['SUITE']).glob('*-attempt-2.json'))
              if retries:
                  output.write('ADB transport retry: ' + ', '.join(retries) + '\n\n')
              output.write('```\n' + (result.read_text() if result.exists() else 'Device suite did not complete\n') + '```\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-device-${{ matrix.suite }}
          include-hidden-files: true
          path: |
            .local/android/device-results.tsv
            .local/android/device-acceptance.log
            .local/android/device-diagnostics.tar
            .local/android/device-flows/
            .local/android/device-fixture-*.log
            .local/android/device-transport/
            .local/android/maestro/
            .local/android/device-instrumentation/
            .local/android/device-recovery/*.log
            .local/android/device-recovery/recovery.json
  android:
    name: Build, JVM and lint
    if: inputs.mode != 'device' && inputs.mode != 'host'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env: &robolectric-env
      MOERISE_ROBOLECTRIC_REPO_URL: https://maven-central.storage-download.googleapis.com/maven2
      MOERISE_ROBOLECTRIC_DIR: ${{ github.workspace }}/.local/android/robolectric
      MOERISE_ROBOLECTRIC_OFFLINE: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@v4
        id: java
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/cache/restore@v4
        id: robolectric
        with:
          path: ${{ env.MOERISE_ROBOLECTRIC_DIR }}
          key: &robolectric-key robolectric-gcs-${{ runner.os }}-${{ runner.arch }}-temurin${{ steps.java.outputs.version }}-${{ hashFiles('scripts/android/robolectric-sdk.sha256', 'mobile/gradle/wrapper/gradle-wrapper.properties', 'mobile/gradle/libs.versions.toml', 'mobile/androidApp/build.gradle.kts', 'mobile/settings.gradle.kts') }}
      - name: Prefetch and verify locked Robolectric SDK
        id: robolectric-sdk
        run: |
          lock="$GITHUB_WORKSPACE/scripts/android/robolectric-sdk.sha256"
          mkdir -p "$MOERISE_ROBOLECTRIC_DIR"
          cd "$MOERISE_ROBOLECTRIC_DIR"
          if ! sha256sum --check "$lock"; then
            while read -r checksum jar; do
              version="${jar#android-all-instrumented-}"
              curl --fail --show-error --silent --location --retry 3 --max-time 180 \
                "$MOERISE_ROBOLECTRIC_REPO_URL/org/robolectric/android-all-instrumented/${version%.jar}/$jar" \
                -o "$jar"
            done < "$lock"
            sha256sum --check "$lock"
          fi
          {
            echo 'jars<<EOF'
            while read -r checksum jar; do
              printf '%s/%s\n' "$MOERISE_ROBOLECTRIC_DIR" "$jar"
            done < "$lock"
            echo EOF
          } >> "$GITHUB_OUTPUT"
      - uses: actions/cache/save@v4
        if: steps.robolectric.outputs.cache-hit != 'true'
        with:
          path: ${{ env.MOERISE_ROBOLECTRIC_DIR }}
          key: *robolectric-key
      - name: Upload verified Robolectric SDK
        uses: actions/upload-artifact@v4
        with:
          name: android-robolectric-sdk
          path: ${{ steps.robolectric-sdk.outputs.jars }}
          include-hidden-files: true
          compression-level: 0
          if-no-files-found: error
          overwrite: true
      - uses: actions/cache@v4
        with:
          path: *gradle-home
          key: *gradle-key
          restore-keys: *gradle-prefix
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Refresh dependency inventory
        if: inputs.refresh_dependencies == true
        run: |
          source scripts/android/environment.sh
          android_gradle --continue --write-verification-metadata sha256 :core:model:test :core:sync:test :core:markdown:test :androidApp:testDebugUnitTest :androidApp:assembleDebug :androidApp:exportReleaseDependencies
          python3 scripts/android/licenses.py
      - uses: actions/upload-artifact@v4
        if: always() && inputs.refresh_dependencies == true
        with:
          name: android-dependency-inventory
          path: |
            mobile/gradle/verification-metadata.xml
            docs/android/THIRD_PARTY_NOTICES.md
            mobile/androidApp/build/reports/release-dependencies.tsv
      - run: >-
          scripts/android/check.sh --continue
          :androidApp:assembleRelease :androidApp:lintRelease
          :androidApp:assembleBenchmark :androidApp:assembleProfile
          :benchmark:assembleBenchmark :benchmark:assembleProfile
          :androidApp:exportReleaseDependencies
      - run: |
          python3 scripts/android/licenses.py --check
          python3 scripts/android/verify-apk.py mobile/androidApp/build/outputs/apk/release/androidApp-release-unsigned.apk --unsigned --release --package io.github.fermin214.moerise
          for variant in benchmark profile; do
            python3 scripts/android/verify-apk.py "mobile/benchmark/build/outputs/apk/$variant/benchmark-$variant.apk" --package io.github.fermin214.moerise.benchmark.runner
          done
      - uses: actions/upload-artifact@v4
        with:
          name: moerise-android-debug
          path: mobile/androidApp/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-check-reports
          include-hidden-files: true
          path: |
            mobile/androidApp/build/reports/tests/
            mobile/core/*/build/reports/tests/
            mobile/androidApp/build/reports/lint-results-*.html
            mobile/androidApp/build/outputs/mapping/release/
  api:
    name: Core API
    needs: [core, android]
    if: inputs.mode != 'device' && inputs.mode != 'host'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env: *robolectric-env
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Download verified Robolectric SDK
        uses: actions/download-artifact@v4
        with:
          name: android-robolectric-sdk
          path: ${{ env.MOERISE_ROBOLECTRIC_DIR }}
      - name: Verify offline Robolectric SDK
        run: |
          cd "$MOERISE_ROBOLECTRIC_DIR"
          sha256sum --check "$GITHUB_WORKSPACE/scripts/android/robolectric-sdk.sha256"
      - uses: actions/cache/restore@v4
        with:
          path: *gradle-home
          key: *gradle-key
          restore-keys: *gradle-prefix
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: actions/setup-node@v6.5.0
        with:
          node-version: "24"
      - uses: actions/download-artifact@v4
        with:
          name: android-fixture-core
          path: ${{ runner.temp }}/fixture
      - name: Run live API checks
        env:
          MOERISE_ANDROID_FIXTURE_BINARY: ${{ runner.temp }}/fixture/moerise
        run: |
          node --test scripts/android/fixture-policy.test.mjs
          scripts/android/live-check.sh
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then scripts/android/stars-check.sh; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-api-reports
          path: mobile/androidApp/build/reports/tests/
