name: Linux packages and images

on:
  workflow_call:

jobs:
  build:
    name: ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # v6.1.0
        with:
          go-version: "1.27.x"
      - uses: actions/setup-node@v6.5.0
        with:
          node-version: "24"
      - name: Run ARM64 Memos acceptance
        if: matrix.arch == 'arm64'
        env:
          CGO_ENABLED: "0"
        run: go test -tags=integration ./tests -run '^TestMemosAcceptance$' -v -count=1
      - name: Build and package Core with Web
        env:
          RELEASE_ARCH: ${{ matrix.arch }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p build
          go build -trimpath -ldflags="-s -w" -o build/moerise .
          version=$(build/moerise version)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$version" = "$(node -p 'require("./web/package.json").version')"
          name="moerise_${version}_linux_${RELEASE_ARCH}"
          package="build/$name"
          mkdir -p "$package/web" "$package/services/layout" "$package/docs"
          mv build/moerise "$package/"
          npm --prefix web run build
          cp config.example.json .env.example LICENSE "$package/"
          cp -R web/dist "$package/web/"
          cp web/server.mjs web/package.json web/MEMOS-LICENSE "$package/web/"
          cp services/layout/server.py services/layout/semantic.py services/layout/requirements.txt "$package/services/layout/"
          cp docs/OPERATIONS.md docs/STARGAZING.md "$package/docs/"
          HOST=127.0.0.1 PORT=3000 node "$package/web/server.mjs" &
          web_pid=$!
          trap 'kill "$web_pid" 2>/dev/null || true' EXIT
          curl -fsS --retry 10 --retry-connrefused --max-time 5 http://127.0.0.1:3000/health/live
          curl -fsS --max-time 5 --output /dev/null http://127.0.0.1:3000/
          tar -czf "build/$name.tar.gz" -C build "$name"
          printf '%s\n' "$version" > "build/version-${RELEASE_ARCH}.txt"
      - name: Build and smoke test container images
        env:
          ARCH: ${{ matrix.arch }}
        run: bash scripts/release/build-images.sh "$(cat "build/version-$ARCH.txt")"
      - name: Store the verified images and record their digests
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
          GHCR_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          for component in core web layout; do
            image="ghcr.io/${GITHUB_REPOSITORY,,}"
            if [[ "$component" != core ]]; then image="$image-$component"; fi
            candidate="$image:ci-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$ARCH"
            docker tag "moerise-ci-$component" "$candidate"
            docker push "$candidate"
            digest=$(docker buildx imagetools inspect "$candidate" --format '{{.Manifest.Digest}}')
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            printf '%s@%s\n' "$image" "$digest" > "build/$component-$ARCH.txt"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: linux-${{ matrix.arch }}
          path: |
            build/*.tar.gz
            build/version-${{ matrix.arch }}.txt
            build/core-${{ matrix.arch }}.txt
            build/web-${{ matrix.arch }}.txt
            build/layout-${{ matrix.arch }}.txt
          compression-level: 0
          if-no-files-found: error
          retention-days: 90
          overwrite: true
