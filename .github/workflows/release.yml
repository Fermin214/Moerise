name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        required: true
        default: v0.1.0
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # v6.1.0
        with:
          go-version: "1.27.x"
      - uses: actions/setup-node@v6.5.0
        with:
          node-version: "24"
      - name: Run ARM64 Memos acceptance
        if: matrix.arch == 'arm64'
        env:
          CGO_ENABLED: "0"
        run: go test -tags=integration ./tests -run '^TestMemosAcceptance$' -v -count=1
      - name: Build and package Core with Web
        env:
          RELEASE_ARCH: ${{ matrix.arch }}
          CGO_ENABLED: "0"
        run: |
          version="${RELEASE_TAG#v}"
          name="moerise_${version}_linux_${RELEASE_ARCH}"
          package="build/$name"
          mkdir -p "$package/web"
          go build -trimpath -ldflags="-s -w" -o "$package/moerise" .
          npm --prefix web run build
          cp config.example.json .env.example LICENSE "$package/"
          cp -R web/dist "$package/web/"
          cp web/server.mjs web/package.json web/MEMOS-LICENSE "$package/web/"
          tar -czf "build/$name.tar.gz" -C build "$name"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-${{ matrix.arch }}
          path: build/*.tar.gz
          compression-level: 0
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: linux-*
          merge-multiple: true
          path: release/
      - name: Upload release packages
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release/*.tar.gz --clobber
          else
            gh release create "$RELEASE_TAG" release/*.tar.gz --verify-tag --title "Moerise $RELEASE_TAG" --generate-notes
          fi
