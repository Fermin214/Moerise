name: Container Images

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Source release tag
        required: true
        default: v0.1.0
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: images-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Sign in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Build and push native images
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          version="${RELEASE_TAG#v}"
          source="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          revision="$(git rev-parse HEAD)"
          docker build --label "org.opencontainers.image.source=$source" \
            --label "org.opencontainers.image.revision=$revision" \
            --label "org.opencontainers.image.version=$version" \
            --tag "$image:$version-$ARCH" .
          docker build --label "org.opencontainers.image.source=$source" \
            --label "org.opencontainers.image.revision=$revision" \
            --label "org.opencontainers.image.version=$version" \
            --tag "$image-web:$version-$ARCH" web
          docker push "$image:$version-$ARCH"
          docker push "$image-web:$version-$ARCH"

  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Sign in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Publish multi-platform version tags
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          version="${RELEASE_TAG#v}"
          for name in "$image" "$image-web"; do
            docker buildx imagetools create --tag "$name:$version" \
              "$name:$version-amd64" "$name:$version-arm64"
          done
