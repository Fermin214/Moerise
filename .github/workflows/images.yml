name: Container images

on:
  workflow_call:

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: ${{ matrix.image }} (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        image: [core, web, layout]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
          - image: core
            context: .
            suffix: ''
          - image: web
            context: web
            suffix: '-web'
          - image: layout
            context: services/layout
            suffix: '-layout'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    env:
      ARCH: ${{ matrix.arch }}
      COMPONENT: ${{ matrix.image }}
      CONTEXT: ${{ matrix.context }}
      IMAGE_SUFFIX: ${{ matrix.suffix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Build and smoke test the image
        shell: bash
        run: |
          version=$(jq -er .version web/package.json)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          docker build --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.version=$version" --tag moerise-ci "$CONTEXT"
          case "$COMPONENT" in
            core) test "$(docker run --rm moerise-ci version)" = "$version" ;;
            web|layout)
              if [[ "$COMPONENT" == web ]]; then
                port=3000 route=/health/live
              else
                port=8766 route=/health
              fi
              docker run --rm -d --name moerise-ci -p "127.0.0.1:18080:$port" moerise-ci
              trap 'docker logs moerise-ci; docker stop moerise-ci' EXIT
              curl -fsS --retry 30 --retry-connrefused --max-time 5 "http://127.0.0.1:18080$route"
              if [[ "$COMPONENT" == web ]]; then
                curl -fsS --max-time 5 --output /dev/null http://127.0.0.1:18080/
              fi
              ;;
          esac
      - name: Store the verified image and record its digest
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}$IMAGE_SUFFIX"
          candidate="$image:ci-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$ARCH"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker tag moerise-ci "$candidate"
          docker push "$candidate"
          digest=$(docker buildx imagetools inspect "$candidate" --format '{{.Manifest.Digest}}')
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf '%s@%s\n' "$image" "$digest" > "$COMPONENT-$ARCH.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: image-${{ matrix.image }}-${{ matrix.arch }}
          path: ${{ matrix.image }}-${{ matrix.arch }}.txt
          if-no-files-found: error
          retention-days: 90
          overwrite: true
