name: Android release
on:
  workflow_call:
    inputs:
      sign:
        type: boolean
        default: false
    secrets:
      ANDROID_SIGNING_KEYSTORE:
        required: false
      ANDROID_KEY_ALIAS:
        required: false
      ANDROID_STORE_PASSWORD:
        required: false
      ANDROID_KEY_PASSWORD:
        required: false
  workflow_dispatch:
    inputs:
      source_ref:
        description: Source commit to build and smoke test
        type: string
        required: false
        default: ''
permissions:
  contents: read
concurrency:
  group: android-release-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    if: ${{ !inputs.sign || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_ref || github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: ${{ inputs.sign && 'gradle' || '' }}
          cache-dependency-path: |
            mobile/**/*.gradle.kts
            mobile/gradle.properties
            mobile/gradle/wrapper/gradle-wrapper.properties
            mobile/gradle/libs.versions.toml
            mobile/gradle/verification-metadata.xml
      - name: Reuse PR Gradle dependencies and compilation outputs
        if: ${{ !inputs.sign }}
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-android-gradle-${{ hashFiles('mobile/**/*.gradle.kts', 'mobile/gradle.properties', 'mobile/gradle/libs.versions.toml', 'mobile/gradle/verification-metadata.xml', 'mobile/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-android-gradle-
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Read 0.3.0 upgrade baseline
        id: baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v0.3.0 --pattern moerise-android-v0.3.0.apk --dir "$RUNNER_TEMP/upgrade"
          baseline_apk="$RUNNER_TEMP/upgrade/moerise-android-v0.3.0.apk"
          version_code=$("$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "$baseline_apk" |
            sed -n "s/^package: .* versionCode='\([0-9][0-9]*\)'.*/\1/p")
          [[ "$version_code" =~ ^[1-9][0-9]*$ ]]
          printf 'version_code=%s\n' "$version_code" >> "$GITHUB_OUTPUT"
      - name: Prepare release signing identity
        if: inputs.sign
        env:
          ANDROID_SIGNING_KEYSTORE: ${{ secrets.ANDROID_SIGNING_KEYSTORE }}
        run: |
          umask 077
          printf '%s' "$ANDROID_SIGNING_KEYSTORE" | base64 --decode > "$RUNNER_TEMP/moerise-release.jks"
          test -s "$RUNNER_TEMP/moerise-release.jks"
      - name: Generate rehearsal signing identity
        if: ${{ !inputs.sign }}
        run: |
          umask 077
          keytool -genkeypair -keystore "$RUNNER_TEMP/moerise-release.jks" -storetype PKCS12 \
            -alias rehearsal -keyalg RSA -keysize 2048 -validity 2 -dname 'CN=Moerise PR rehearsal' \
            -storepass rehearsal -keypass rehearsal -noprompt
      - name: Build APK
        id: build
        env:
          BASELINE_VERSION_CODE: ${{ steps.baseline.outputs.version_code }}
          MOERISE_ANDROID_KEYSTORE: ${{ runner.temp }}/moerise-release.jks
          MOERISE_ANDROID_KEY_ALIAS: ${{ !inputs.sign && 'rehearsal' || secrets.ANDROID_KEY_ALIAS }}
          MOERISE_ANDROID_STORE_PASSWORD: ${{ !inputs.sign && 'rehearsal' || secrets.ANDROID_STORE_PASSWORD }}
          MOERISE_ANDROID_KEY_PASSWORD: ${{ !inputs.sign && 'rehearsal' || secrets.ANDROID_KEY_PASSWORD }}
        run: |
          run_code=$((GITHUB_RUN_NUMBER + 100))
          version_code=$((run_code > BASELINE_VERSION_CODE ? run_code : BASELINE_VERSION_CODE + 1))
          MOERISE_ANDROID_VERSION_CODE="$version_code" scripts/android/release.sh --sign
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c
        with:
          go-version: "1.27.x"
      - uses: actions/setup-node@v6.5.0
        with:
          node-version: "24"
      - name: Prepare signed APK checks
        run: |
          bash scripts/android/install-maestro.sh
          python3 -m pip install --disable-pip-version-check -r scripts/android/maestro/requirements.txt
          docker build -t moerise-android-layout:fixture services/layout
      - name: Prepare 0.3.0 upgrade baseline
        env:
          MOERISE_ANDROID_KEYSTORE: ${{ runner.temp }}/moerise-release.jks
          MOERISE_ANDROID_KEY_ALIAS: ${{ !inputs.sign && 'rehearsal' || secrets.ANDROID_KEY_ALIAS }}
          MOERISE_ANDROID_STORE_PASSWORD: ${{ !inputs.sign && 'rehearsal' || secrets.ANDROID_STORE_PASSWORD }}
          MOERISE_ANDROID_KEY_PASSWORD: ${{ !inputs.sign && 'rehearsal' || secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ '${{ inputs.sign }}' != true ]]; then
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign --ks "$MOERISE_ANDROID_KEYSTORE" --ks-key-alias "$MOERISE_ANDROID_KEY_ALIAS" --ks-pass env:MOERISE_ANDROID_STORE_PASSWORD --key-pass env:MOERISE_ANDROID_KEY_PASSWORD "$RUNNER_TEMP/upgrade/moerise-android-v0.3.0.apk"
          fi
          python3 scripts/android/verify-apk.py "${{ steps.build.outputs.apk }}" --release --package io.github.fermin214.moerise --same-signer-as "$RUNNER_TEMP/upgrade/moerise-android-v0.3.0.apk"
      - name: Remove signing file
        if: always()
        run: rm -f "$RUNNER_TEMP/moerise-release.jks"
      - name: Check signed APK on minimum Android version
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808
        with:
          api-level: ${{ steps.build.outputs.min_sdk }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            bash scripts/android/release-smoke.sh "${{ steps.build.outputs.apk }}"
            adb uninstall io.github.fermin214.moerise
            MOERISE_ANDROID_SMOKE_OUTPUT=.local/android/release-smoke/upgrade-smoke MOERISE_ANDROID_UPGRADE_FROM="$RUNNER_TEMP/upgrade/moerise-android-v0.3.0.apk" bash scripts/android/release-smoke.sh "${{ steps.build.outputs.apk }}"
      - name: Verify Android release artifacts
        run: |
          artifact_root="$RUNNER_TEMP/release-verification"
          mkdir -p "$artifact_root/android"
          ln -s "$PWD/.local/android/releases" "$artifact_root/android/android-release"
          ln -s "$PWD/.local/android/release-smoke" "$artifact_root/android/android-release-checks"
          python3 scripts/release/publish.py "$artifact_root" "$(git rev-parse HEAD)" android --run-id "$GITHUB_RUN_ID" --verify-only
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-release-checks
          include-hidden-files: true
          path: .local/android/release-smoke/
          retention-days: 90
          overwrite: true
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: android-release
          include-hidden-files: true
          path: .local/android/releases/
          if-no-files-found: error
          retention-days: 90
          overwrite: true
