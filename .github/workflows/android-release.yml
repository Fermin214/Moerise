name: Android release
on:
  workflow_call:
    inputs:
      sign:
        type: boolean
        default: false
    secrets:
      ANDROID_SIGNING_KEYSTORE:
        required: false
      ANDROID_KEY_ALIAS:
        required: false
      ANDROID_STORE_PASSWORD:
        required: false
      ANDROID_KEY_PASSWORD:
        required: false
  workflow_dispatch:
    inputs:
      sign:
        description: Sign with the Android release identity
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: android-release-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    if: ${{ !inputs.sign || github.ref == 'refs/heads/main' }}
    env:
      SIGN_APK: ${{ inputs.sign }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            mobile/**/*.gradle.kts
            mobile/gradle/libs.versions.toml
            mobile/gradle/verification-metadata.xml
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Prepare signing identity
        if: env.SIGN_APK == 'true'
        env:
          ANDROID_SIGNING_KEYSTORE: ${{ secrets.ANDROID_SIGNING_KEYSTORE }}
        run: |
          umask 077
          printf '%s' "$ANDROID_SIGNING_KEYSTORE" | base64 --decode > "$RUNNER_TEMP/moerise-release.jks"
          test -s "$RUNNER_TEMP/moerise-release.jks"
      - name: Build APK
        env:
          MOERISE_ANDROID_KEYSTORE: ${{ runner.temp }}/moerise-release.jks
          MOERISE_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          MOERISE_ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          MOERISE_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ "$SIGN_APK" = true ]; then
            scripts/android/release.sh --sign
          else
            scripts/android/release.sh --unsigned
          fi
      - name: Remove signing file
        if: always()
        run: rm -f "$RUNNER_TEMP/moerise-release.jks"
      - name: Enable emulator acceleration
        if: env.SIGN_APK == 'true'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c
        if: env.SIGN_APK == 'true'
        with:
          go-version: "1.27.x"
      - uses: actions/setup-node@v6.5.0
        if: env.SIGN_APK == 'true'
        with:
          node-version: "24"
      - name: Prepare signed APK checks
        if: env.SIGN_APK == 'true'
        run: |
          bash scripts/android/install-maestro.sh
          python3 -m pip install --disable-pip-version-check -r scripts/android/maestro/requirements.txt
      - name: Check signed APK on minimum Android version
        if: env.SIGN_APK == 'true'
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808
        with:
          api-level: 26
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -writable-system
          script: bash scripts/android/release-smoke.sh
      - uses: actions/upload-artifact@v4
        if: always() && env.SIGN_APK == 'true'
        with:
          name: android-release-checks
          include-hidden-files: true
          path: .local/android/release-smoke/
          retention-days: 90
          overwrite: true
      - uses: actions/upload-artifact@v4
        with:
          name: android-release
          include-hidden-files: true
          path: .local/android/releases/
          if-no-files-found: error
          retention-days: 90
          overwrite: true
