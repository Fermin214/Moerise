name: Android release
on:
  push:
    tags: ['android-v*']
  workflow_dispatch:
    inputs:
      sign:
        description: Sign with the Android release identity
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            mobile/**/*.gradle.kts
            mobile/gradle/libs.versions.toml
            mobile/gradle/verification-metadata.xml
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Prepare signing identity
        if: startsWith(github.ref, 'refs/tags/android-v') || inputs.sign
        env:
          ANDROID_SIGNING_KEYSTORE: ${{ secrets.ANDROID_SIGNING_KEYSTORE }}
        run: |
          umask 077
          printf '%s' "$ANDROID_SIGNING_KEYSTORE" | base64 --decode > "$RUNNER_TEMP/moerise-release.jks"
          test -s "$RUNNER_TEMP/moerise-release.jks"
      - name: Build APK
        env:
          SIGN_APK: ${{ startsWith(github.ref, 'refs/tags/android-v') || inputs.sign }}
          MOERISE_ANDROID_KEYSTORE: ${{ runner.temp }}/moerise-release.jks
          MOERISE_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          MOERISE_ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          MOERISE_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ "$SIGN_APK" = true ]; then
            scripts/android/release.sh --sign
          else
            scripts/android/release.sh --unsigned
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: android-release
          include-hidden-files: true
          path: .local/android/releases/
      - name: Enable emulator acceleration
        if: startsWith(github.ref, 'refs/tags/android-v') || inputs.sign
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Check signed APK on minimum Android version
        if: startsWith(github.ref, 'refs/tags/android-v') || inputs.sign
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808
        with:
          api-level: 26
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install "$(find .local/android/releases -name 'moerise-android-v*.apk' ! -name '*-unsigned.apk' -print -quit)"
            adb shell am start -W -n io.github.fermin214.moerise/io.github.fermin214.moerise.MainActivity
            adb shell uiautomator dump /sdcard/moerise-release.xml
            adb pull /sdcard/moerise-release.xml .local/android/release-ui.xml
            grep -q 'server_login' .local/android/release-ui.xml
            adb shell pidof io.github.fermin214.moerise
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/android-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          metadata = pathlib.Path("mobile/androidApp/build/outputs/apk/release/output-metadata.json")
          version = json.loads(metadata.read_text())["elements"][0]["versionName"]
          assert os.environ["GITHUB_REF_NAME"] == "android-v" + version, "Tag and APK version differ"
          root = next(pathlib.Path(".local/android/releases").glob("v" + version + "-*"))
          files = [root / ("moerise-android-v" + version + suffix) for suffix in
                   (".apk", ".apk.sha256", ".apk.json", "-notices.zip")]
          subprocess.run(["gh", "release", "create", os.environ["GITHUB_REF_NAME"],
                          "--verify-tag", "--latest=false",
                          "--title", "Moerise Android " + version,
                          "--notes-file", "docs/android/INSTALL.md", *map(str, files)], check=True)
          PY
      - name: Remove signing file
        if: always()
        run: rm -f "$RUNNER_TEMP/moerise-release.jks"
