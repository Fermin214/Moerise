name: Main smoke

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke:
    name: Build and smoke test Core and Web
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c
        with:
          go-version: "1.27.x"
      - uses: actions/setup-node@v6.5.0
        with:
          node-version: "24"
      - name: Build and run Core version command
        env:
          CGO_ENABLED: "0"
        run: |
          go build -trimpath -o build/moerise .
          ./build/moerise version
      - name: Build and start Web
        run: |
          npm --prefix web run build
          HOST=127.0.0.1 PORT=3000 node web/server.mjs &
          web_pid=$!
          trap 'kill "$web_pid" 2>/dev/null || true' EXIT
          curl --fail --silent --show-error --retry 10 --retry-connrefused --max-time 5 http://127.0.0.1:3000/health/live
          curl --fail --silent --show-error --max-time 5 --output /dev/null http://127.0.0.1:3000/
